# Databases for integration tests (make it). Every server also accepts TLS:
#   postgres and mysql negotiate it on the same port; redis has a separate TLS port.
# PostgreSQL and Redis use the test certificate in tests/fixtures (ec_cert.pem); MySQL uses
# its auto-generated RSA certificate.
# Host ports avoid the defaults so a local database is not hit by accident.
name: dbdash-it

services:
  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --requirepass
      - dbdash_pw
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/ec_cert.pem
      - --tls-key-file
      - /certs/ec.key
      - --tls-auth-clients
      - "no"
    volumes:
      - ../fixtures:/certs:ro
    ports: ["16379:6379", "16380:6380"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dbdash
      POSTGRES_PASSWORD: dbdash_pw
      POSTGRES_DB: dbdash_test
      # "md5" in pg_hba also accepts SCRAM for SCRAM-stored passwords, so both
      # the default (SCRAM) user and md5_user below can log in.
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    # The key must belong to the postgres user with mode 0600, so copy it first.
    command:
      - sh
      - -c
      - >-
        cp /certs/ec_cert.pem /certs/ec.key /var/lib/postgresql/ &&
        chown postgres /var/lib/postgresql/ec_cert.pem /var/lib/postgresql/ec.key &&
        chmod 600 /var/lib/postgresql/ec.key &&
        exec docker-entrypoint.sh postgres -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/ec_cert.pem
        -c ssl_key_file=/var/lib/postgresql/ec.key
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ../fixtures:/certs:ro
    ports: ["15432:5432"]

  mysql:
    image: mysql:8.4
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: dbdash_test
      MYSQL_USER: dbdash
      MYSQL_PASSWORD: dbdash_pw
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["13306:3306"]

  mongodb:
    image: mongo:7.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: dbdash
      MONGO_INITDB_ROOT_PASSWORD: dbdash_pw
    ports: ["17017:27017"]

  cassandra:
    image: cassandra:5.0
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
      CASSANDRA_AUTHENTICATOR: PasswordAuthenticator
    # cassandra/cassandra is the default superuser with PasswordAuthenticator.
    ports: ["19042:9042"]
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -u cassandra -p cassandra -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Dbdash_pw1"
      MSSQL_PID: Developer
    ports: ["11433:1433"]
