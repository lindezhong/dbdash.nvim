# HTTPS for the http(s):// integration tests: the test PKI chain (localhost/127.0.0.1),
# static JSON and a cookie round trip. Plain HTTP on 80 for the same routes.
events {}
http {
  server {
    listen 80;
    listen 443 ssl;
    ssl_certificate /certs/pki/leaf_chain.pem;
    ssl_certificate_key /certs/pki/leaf.key;
    default_type application/json;
    absolute_redirect off; # Location: /items (the host port differs from the container port)

    location = /items {
      return 200 '[{"name":"a","n":1},{"name":"b","n":2}]';
    }
    location = /wrapped {
      return 200 '{"data":{"items":[{"name":"a","n":1}]},"total":1}';
    }
    location = /login {
      add_header Set-Cookie "session=s3cret; Path=/; HttpOnly";
      return 200 '[]';
    }
    location = /whoami {
      return 200 '[{"cookie":"$http_cookie"}]';
    }
    location = /old {
      return 301 /items;
    }
  }
}
