# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Pie chart: every renderer and option, one panel each (press K on a panel). After
# Chart.js pie / doughnut and ECharts pie: a bar or a circle, a hole, a half circle,
# sorting, the first N and "Other", colors, and what the legend shows.

title: "Pie chart"
description: |
  A pie chart shows each row's share: `label_column` names the slices, `value_column`
  sizes them (positive values only). The default renderer is one proportional bar with a
  legend; `chart { renderer: circle }` draws a round pie. See `:help dbdash-charts`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "bar (default): series:nth-child(N) colors"
      description: |
        One bar split in proportion, the legend under it with the value and the percentage.
        `series:nth-child(N) { color }` colors the slices in order.
      label_column: dept
      value_column: budget
    style:
      "series:nth-child(1)": { color: "#e06c75" }
      "series:nth-child(2)": { color: "#61afef" }
      "series:nth-child(3)": { color: "#98c379" }
      "series:nth-child(4)": { color: "#e5c07b" }
      "series:nth-child(5)": { color: "#c678dd" }
      "series:nth-child(6)": { color: "#56b6c2" }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "chart { renderer: circle, palette: tableau }"
      description: |
        A round pie on a braille canvas, the legend beside it (`legend { position: bottom }`
        puts it under); `palette: tableau` instead of the colorscheme's colors.
      label_column: dept
      value_column: budget
    style:
      chart: { renderer: circle, palette: tableau }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "chart { hole }, format"
      description: |
        `chart { hole: 0.6 }` leaves a hole of 60% of the radius (a doughnut, Chart.js
        `cutout`) and writes the total in it; `format` is the Python format of the values
        ("{:,} k").
      label_column: dept
      value_column: budget
      format: "{:,} k"
    style:
      chart: { renderer: circle, hole: 0.6 }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "chart { angle: 180 }, legend { position: bottom }"
      description: |
        `chart { angle: 180 }` draws the upper half (Chart.js `circumference: 180`, a
        gauge-like pie); `legend { position: bottom }` puts the legend under it.
      label_column: dept
      value_column: budget
    style:
      chart: { renderer: circle, angle: 180 }
      legend: { position: bottom }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "sort, top, other_label"
      description: |
        `sort: desc` orders the slices by size, `top: 3` keeps the three largest and puts the
        rest in one slice named by `other_label` (default "Other"; styled as `series.other`).
      label_column: dept
      value_column: budget
      sort: desc
      top: 3
      other_label: Rest
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "series.<name> colors, legend parts"
      description: |
        `series.<name> { color }` colors slices by name; `label`, `value` and `percent {
        display: none }` leave a column out of the legend.
      label_column: dept
      value_column: budget
    style:
      "series.Engineering": { color: "#61afef" }
      "series.Sales": { color: "#98c379" }
      value: { display: none }
