# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Cassandra (:help dbdash-databases). Runs against `make it-up` (port 19042, user and
# password cassandra; it takes a minute to start). The query is CQL; these read the
# system keyspaces, so nothing has to be created. For your own cluster:
#   cassandra://user:pass@host:9042/keyspace?consistency=LOCAL_QUORUM  (cql:// too)

title: "Cassandra"
description: |
  Cassandra: CQL against the system keyspaces, with `consistency=ONE` in the URL. Needs
  `make it-up` (port 19042, cassandra / cassandra). See `:help dbdash-databases`.

database:
  url: "cql://cassandra:cassandra@127.0.0.1:19042/system?consistency=ONE"
  type: cassandra

style:
  dashboard: { grid-template-columns: 2 }
  panel: { border: rounded, border-color: "#56b6c2" }
  table: { border-color: "#56b6c2" }

panels:
  - query:
      sql: SELECT cluster_name, release_version, cql_version, data_center, rack FROM system.local
    show:
      type: table
      title: "system.local"
      description: |
        The node's own row of `system.local`: cluster name, versions, data center and rack.
      interval: 1m

  - query:
      sql: SELECT keyspace_name, durable_writes FROM system_schema.keyspaces
    show:
      type: table
      title: "Keyspaces (system_schema)"
      description: |
        Every keyspace and whether its writes are durable (`system_schema.keyspaces`).
      interval: 1m

  - query:
      sql: SELECT keyspace_name, table_name FROM system_schema.tables
      transform: |
        -- Tables per keyspace (CQL has no GROUP BY across partitions here).
        local count = {}
        for _, r in ipairs(rs.rows) do count[r[1]] = (count[r[1]] or 0) + 1 end
        local out = {}
        for k, n in pairs(count) do out[#out + 1] = { keyspace = k, tables = n } end
        table.sort(out, function(a, b) return a.tables > b.tables end)
        return out
    show:
      type: bar
      title: "Tables per keyspace"
      description: |
        Tables per keyspace: CQL has no GROUP BY across partitions here, so
        `query.transform` counts the rows of `system_schema.tables` in Lua.
      x_column: keyspace
      y_column: tables
      interval: 1m
    style:
      panel: { grid-column: span 2 }
