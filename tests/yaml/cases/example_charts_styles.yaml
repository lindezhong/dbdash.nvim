# yaml-language-server: $schema=../dbdash.schema.yaml
#
# The alternative styles side by side (show.renderer / show.canvas). The same choices can
# be tried on any dashboard without editing it: :DbDashStyle line asciichart,
# :DbDashStyle canvas quadrant, :DbDashStyle reset. Defaults for every dashboard can be
# set with require("dbdash").setup({ styles = { line = { canvas = "quadrant" } } }).

database:
  url: "sqlite:///:memory:"

interval: 2m

layout:
  columns: 2
  gap: 3

panels:
  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 50 + abs(random() % 100) AS visits FROM h
    show:
      type: line
      title: "line / canvas / braille (default)"
      x_column: hour
      y_column: visits

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 50 + abs(random() % 100) AS visits FROM h
    show:
      type: line
      title: "line / asciichart"
      renderer: asciichart
      x_column: hour
      y_column: visits

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 50 + abs(random() % 100) AS visits FROM h
    show:
      type: line
      title: "line / canvas / quadrant"
      canvas: quadrant               # braille, quadrant, block, halfblock, ascii
      x_column: hour
      y_column: visits

  - query:
      sql: |
        SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80
        UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "bar / vertical"
      renderer: vertical
      x_column: region
      y_column: sales

  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 80)
        SELECT abs(random() % 100) AS score FROM n
    show:
      type: histogram
      title: "histogram / vertical"
      renderer: vertical
      value_column: score
      bins: 8

  - query:
      sql: |
        SELECT 'IT' AS dept, 42 AS people UNION ALL SELECT 'HR', 7
        UNION ALL SELECT 'Finance', 15 UNION ALL SELECT 'R&D', 120
    show:
      type: pie
      title: "pie / circle"
      renderer: circle
      label_column: dept
      value_column: people

  - query:
      sql: |
        WITH RECURSIVE d(day) AS (SELECT 1 UNION ALL SELECT day + 1 FROM d WHERE day < 5),
                       h(hour) AS (SELECT 8 UNION ALL SELECT hour + 2 FROM h WHERE hour < 18)
        SELECT 'Day ' || day AS day, hour, abs(random() % 50) AS load FROM d CROSS JOIN h
    show:
      type: heatmap
      title: "heatmap / block with values"
      renderer: block
      x_column: hour
      y_column: day
      value_column: load
      style:
        show_values: true
      span: 2
