# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Panel state in Lua and templates (generated data, SQLite in memory):
# - store: a table each panel keeps while the dashboard runs (here: a refresh counter, and
#   a list of the last 20 results drawn as a line).
# - meta.prev_ok: the last successful refresh's run record, with its rows after and before
#   query.transform (.result, .query; here: the change since then); meta.prev the previous
#   refresh's, with .error when it failed.
# - dbdash.run(args): the panel's query again with other arguments (here: the same count
#   over twice the days), from query.transform, from a {% lua %} block in query.sql, and
#   from an imported module (modules/callbacks.lua); meta.run.kind ("refresh" or "callback")
#   keeps a callback from calling again. Callbacks of callbacks go deeper: meta.run.depth
#   (0 in a refresh, 1 in its callback, 2 in that one's, ...) stops them at a level.
# - {% set args.x = v %} / args.x = v: set an argument for the rest of the refresh and keep
#   it like an edit with `a` (here: days is capped at 30; try :DbDashUpdateVariable days 90).
# - show.refresh_hidden: keep refreshing while the dashboard is not visible.
# - Run records (:help dbdash-runs): every refresh and callback has an id, its caller,
#   times and data; meta.prev_runs lists the previous refresh's life.
# It runs Lua, so dbdash asks whether you trust this file first (:help dbdash-lua).

title: "Panel state"
description: |
  Panel state and callbacks: `store` keeps values between refreshes, `dbdash.run()`
  runs the query again with other arguments, and `meta` has the run records. Runs Lua,
  so it asks for trust first. See `:help dbdash-callback`.

database:
  url: "sqlite:///:memory:"

interval: 10s

args:
  - name: days
    type: int
    default: 7
    description: "Days counted (at most 30)"

show:
  args_show: true

style:
  dashboard: { grid-template-columns: 2 }
  countdown: { display: block, content: "{time}s" }

panels:
  - query:
      sql: |
        {% if args.days > 30 %}{% set args.days = 30 %}{% endif %}
        SELECT {{ args.days }} * 100 + abs(random() % 50) AS orders
      transform: |
        store.refreshes = (store.refreshes or 0) + 1
        local orders = rs.rows[1][1]
        local prev = meta.prev_ok and meta.prev_ok.result.rows[1][1] or orders
        return { columns = { "orders", "change", "refreshes" },
                 rows = { { orders, orders - prev, store.refreshes } } }
    show:
      type: table
      title: "Orders, change since the last refresh"
      description: |
        The change of the orders since the last refresh, kept in `store`.
      refresh_hidden: true          # keeps counting while the dashboard is hidden

  - query:
      sql: |
        {# the cap applies to the refresh, not to its callback (days * 2) #}
        {% if meta.run.kind == "refresh" and args.days > 30 %}{% set args.days = 30 %}{% endif %}
        SELECT {{ args.days }} AS days, {{ args.days }} * 100 + abs(random() % 50) AS orders
      transform: |
        if meta.run.kind == "callback" then return rs end   -- the callback's rows, as they are
        local wider = dbdash.run({ days = args.days * 2 }).rows[1]
        return { columns = { "days", "orders", "days_2x", "orders_2x" },
                 rows = { { rs.rows[1][1], rs.rows[1][2], wider[1], wider[2] } } }
    show:
      type: table
      title: "Twice as long: from query.transform"
      description: |
        `dbdash.run({ days = ... })` from `query.transform`: the same query with another
        argument, its rows used in this result.

  - query:
      sql: |
        SELECT {{ args.days }} AS days, {{ args.days }} * 100 + abs(random() % 50) AS orders,
        {% lua %}
          if meta.run.kind == "callback" then return "NULL" end   -- the callback leaves it empty
          return dbdash.run({ days = args.days * 2 }).rows[1][2]
        {% endlua %} AS orders_2x
    show:
      type: table
      title: "Twice as long: from {% lua %} in query.sql"
      description: |
        The same callback from a {% raw %}`{% lua %}`{% endraw %} block in `query.sql`.

  - query:
      sql: |
        {% import 'modules/callbacks.lua' as cb %}
        SELECT {{ args.days }} AS days, {{ args.days }} * 100 + abs(random() % 50) AS orders,
               {{ cb.orders(args.days * 2) if meta.run.kind == "refresh" else 'NULL' }} AS orders_2x
    show:
      type: table
      title: "Twice as long: from an imported module"
      description: |
        The same callback from a function of an imported module (`modules/callbacks.lua`).

  - query:
      sql: SELECT abs(random() % 100) AS orders
      transform: |
        -- Keep each refresh's result in a list (the last 20) and show the list.
        store.history = store.history or {}
        table.insert(store.history, { at = os.date("%H:%M:%S"), orders = rs.rows[1][1] })
        while #store.history > 20 do
          table.remove(store.history, 1)
        end
        return { columns = { "at", "orders" }, rows = vim.tbl_map(function(h)
          return { h.at, h.orders }
        end, store.history) }
    show:
      type: line
      title: "History kept in store (last 20 refreshes)"
      description: |
        `store` keeps the last 20 values; the line shows them.
      x_column: at
      y_column: orders
      interval: 2s
    style:
      panel: { grid-column: span 2 }

  - database: { url: "lua://" }
    query:
      sql: |
        -- A refresh with two callbacks; the table lists the previous refresh's life
        -- (meta.prev_runs): its records, with ids, callers and times (the current life on
        -- the first refresh, still running).
        if meta.run.kind == "callback" then return { { days = args.days } } end
        dbdash.run({ days = args.days })
        dbdash.run({ days = args.days * 2 })
        local short = function(id) return id and id:sub(1, 8) .. "…" .. id:sub(-4) or "" end
        local rows = {}
        for _, r in ipairs(meta.prev_runs or meta.runs) do
          rows[#rows + 1] = { short(r.id), r.kind, r.depth, short(r.parent_id), r.args.days,
                              r.elapsed_ms or "", r.ok == nil and "…" or tostring(r.ok) }
        end
        return { columns = { "id", "kind", "depth", "parent", "days", "ms", "ok" }, rows = rows }
    show:
      type: table
      title: "Run records of the previous refresh (meta.prev_runs)"
      description: |
        `meta.prev_runs`: the run records of the previous refresh (ids, kinds, times,
        results).
    style:
      panel: { grid-column: span 2 }

  - database: { url: "lua://" }
    query:
      sql: |
        -- Callbacks of callbacks: every level runs the query again with twice the days
        -- until meta.run.depth is 3, so the refresh (depth 0) has a chain of three
        -- callbacks; it lists every level of its life (meta.runs).
        if meta.run.depth < 3 then
          dbdash.run({ days = args.days * 2 })
        end
        if meta.run.kind == "callback" then
          return { { days = args.days } }
        end
        local rows = {}
        for _, r in ipairs(meta.runs) do
          rows[#rows + 1] = { r.depth, r.kind, r.args.days, r.ok == nil and "…" or tostring(r.ok) }
        end
        return { columns = { "depth", "kind", "days", "ok" }, rows = rows }
    show:
      type: table
      title: "Callbacks of callbacks, stopped at meta.run.depth 3"
      description: |
        Callbacks that call themselves stop at `meta.run.depth` 3 (and at
        `lua.max_callback_depth`).
