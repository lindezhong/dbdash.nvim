# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Scatter plot: every canvas and option, one panel each (press K on a panel). Points by
# x_column / y_column, colored by color_column, with markers, a trend line, a log axis,
# grid lines and reference lines (Chart.js / ECharts options).

title: "Scatter plot"
description: |
  A scatter plot puts one point per row at (`x_column`, `y_column`); `color_column`
  splits the points into colored groups (`colors` by name). See `:help dbdash-chart-types`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

layout:
  columns: 2

panels:
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "color_column, colors, x_label / y_label (canvas: braille)"
      description: |
        `color_column` makes one group per value, colored by `colors` (a mapping by name, or a
        list by position); `x_label` / `y_label` title the axes.
      x_column: ad_spend
      y_column: sales
      color_column: margin
      colors: { High: "#98c379", Medium: "#e5c07b", Low: "#e06c75" }
      x_label: "Advertising"
      y_label: "Sales"
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "style: point, trend_line: linear"
      description: |
        `point` draws each point as a character (Chart.js `pointStyle`); `trend_line: linear`
        adds a dashed least-squares line per group (ECharts regression).
      x_column: ad_spend
      y_column: sales
      style: { point: "●", trend_line: linear }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "axes: grid, ticks; mark_lines"
      description: |
        `axes.*.grid` draws grid lines at the ticks, `ticks` asks for about that many ticks;
        `mark_lines` adds reference lines: the mean sales, and x = 50.
      x_column: ad_spend
      y_column: sales
      axes:
        x_axis: { grid: true, ticks: 5 }
        y_axis: { grid: true }
      mark_lines:
        - { value: mean }
        - { value: 50, axis: x, label: "budget" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 30)
        SELECT power(10, (abs(random() % 400) / 100.0)) AS size_kb,
               power(10, (abs(random() % 300) / 100.0)) AS ms
        FROM n
    show:
      type: scatter
      title: "axes: scale: log on both axes"
      description: |
        Log scales (Chart.js `type: logarithmic`) for values over several orders of magnitude:
        one tick per power of ten.
      x_column: size_kb
      y_column: ms
      axes:
        x_axis: { scale: log, title: "size (KB)" }
        y_axis: { scale: log, title: "time (ms)" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "canvas: quadrant"
      description: "`canvas: quadrant`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      canvas: quadrant
      x_column: ad_spend
      y_column: sales
      color_column: margin
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "canvas: block"
      description: "`canvas: block`: one full block per pixel: coarse but bold."
      canvas: block
      x_column: ad_spend
      y_column: sales
      color_column: margin
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "canvas: halfblock"
      description: "`canvas: halfblock`: 1 x 2 pixels per character (▀ ▄)."
      canvas: halfblock
      x_column: ad_spend
      y_column: sales
      color_column: margin
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "canvas: ascii"
      description: "`canvas: ascii`: plain ASCII, for any terminal or font."
      canvas: ascii
      x_column: ad_spend
      y_column: sales
      color_column: margin
