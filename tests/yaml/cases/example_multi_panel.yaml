# yaml-language-server: $schema=./dbdash.schema.yaml
#
# Several panels in one dashboard (layout.columns per row; show.span to widen a panel).
# Each panel refreshes on its own show.interval; the top-level interval is the default
# and also refreshes every panel.
database:
  url: "sqlite:///:memory:"

interval: 60s

args:
  - name: hours
    type: int
    default: 24
    description: "Hours of history"

layout:
  columns: 2
  gap: 3

panels:
  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < {{ hours }} - 1)
        SELECT printf('%02d:00', n % 24) AS hour,
               50 + abs(random() % 100) AS visits
        FROM h
    show:
      type: line
      title: "Visits per hour"
      x_column: hour
      y_column: visits
      interval: 10s
      span: 2
      show_countdown: true
      countdown_format: "{time}s"

  - query:
      sql: |
        SELECT 'IT' AS dept, 42 AS people UNION ALL SELECT 'HR', 7
        UNION ALL SELECT 'Finance', 15 UNION ALL SELECT 'R&D', 120
    show:
      type: pie
      renderer: circle
      title: "Headcount"
      label_column: dept
      value_column: people

  - query:
      sql: |
        SELECT datetime('now') AS now, abs(random() % 1000) AS orders
    show:
      type: table
      title: "Now"
      show_countdown: true
      countdown_format: "{time}s"
