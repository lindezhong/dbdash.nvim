# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Bubble chart: every canvas and option, one panel each (press K on a panel). A scatter
# plot whose point size follows size_column, colored by color_column and labeled by
# label_column.

title: "Bubble chart"
description: |
  A bubble chart is a scatter plot with sizes: (`x_column`, `y_column`) per row, the
  circle's area by `size_column`, groups by `color_column`, a text by `label_column`.
  See `:help dbdash-chart-types`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

layout:
  columns: 2

panels:
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "size, color and label columns (canvas: braille)"
      description: |
        `size_column` sets each circle's area, `color_column` groups and colors the bubbles
        (`colors` by name), `label_column` writes a text next to each.
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
      label_column: company
      colors: { Large: "#61afef", Mid: "#98c379", Small: "#e5c07b" }
      axes:
        x_axis: { title: "Revenue" }
        y_axis: { title: "Margin %" }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "style: size_range, point, trend_line"
      description: |
        `size_range: [min, max]` is the smallest and largest radius in canvas pixels (Chart.js
        `radius`); `point` marks each center with a character; `trend_line: linear` fits a
        dashed line through the centers.
      x_column: revenue
      y_column: margin
      size_column: cap
      style: { size_range: [2, 10], point: "+", trend_line: linear }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "canvas: quadrant"
      description: "`canvas: quadrant`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      canvas: quadrant
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "canvas: block"
      description: "`canvas: block`: one full block per pixel: coarse but bold."
      canvas: block
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "canvas: halfblock"
      description: "`canvas: halfblock`: 1 x 2 pixels per character (▀ ▄)."
      canvas: halfblock
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "canvas: ascii"
      description: "`canvas: ascii`: plain ASCII, for any terminal or font."
      canvas: ascii
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
