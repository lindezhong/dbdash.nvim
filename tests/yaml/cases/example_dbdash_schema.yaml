# JSON Schema (draft-07, written in YAML) for dbdash.nvim dashboard configs.
#
# Editors with yaml-language-server pick it up from a modeline at the top of a config:
#   # yaml-language-server: $schema=./dbdash.schema.yaml
#
# The sidebar (:DbDash) does not list *.schema.yaml files (default sidebar.exclude).
#
# Defaults below marked "setup" can be changed for all configs with
# require("dbdash").setup({ defaults = { ... } }); see :help dbdash-setup.
#
# Result format (:help dbdash-result) - referred to by query.sql (lua://, http(s)://, the
# push sources) and query.transform below. Every query goes: query -> query.transform (if
# any) -> a check that the result is rows. SQL databases, Redis, MongoDB and Cassandra
# return rows; a lua:// script, an HTTP response (decoded JSON), an item of a push source
# (luastream://, exec://, webhook://: JSON text) and a transform must return one of:
#   { columns = { "a", "b" }, rows = { { 1, "x" } } }        rows by position
#   { columns = { "a", "b" }, rows = { { a = 1, b = "x" } } } rows by name
#   { { a = 1, b = "x" }, ... }                               records (columns sorted by
#                                                             name, or a columns list)
# In JSON: [{"a": 1}] or {"columns": ["a"], "rows": [[1]]}. nil / null is NULL; column
# types follow the first non-NULL value; query.max_rows applies. Anything else (an
# object such as {"data": [...]}, a number, text) is an error that suggests a transform.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "dbdash.schema.yaml"
title: dbdash.nvim dashboard
description: >-
  One dashboard: either a single chart (database / query / show) or several panels
  (panels / layout). Top-level bare fields (interval, args, layout) are dashboard-wide; the
  top-level database, query and show are the panels' defaults (without panels: the only
  panel). See :help dbdash-config.
type: object
if: { required: [panels] }
then:
  # With panels the top-level query and show are defaults: fields describing one chart
  # belong in each panel.
  properties:
    query:
      properties: { sql: false, transform: false, args: false }
    show:
      properties:
        { type: false, title: false, subtitle: false, description: false, span: false, area: false, row: false, column: false, row_span: false, column_list: false, x_label: false, y_label: false }
      patternProperties: { "_columns?$": false }
else:
  required: [database] # query too, except for http(s):// (a GET of the URL) and webhook://
  not: { required: [layout] } # layout only applies with panels
dependencies:
  show_countdown: [interval] # it counts down to the global refresh
properties:
  database:
    $ref: "#/definitions/database"
    description: >-
      The database of a single chart; with panels, the default of every panel that does not
      set its own (replaced as a whole by a panel's database; optional when every panel sets
      one).
  query:
    $ref: "#/definitions/query"
    description: The single chart's query; with panels, defaults of every panel's query (timeout, max_rows, autoescape).
  show:
    $ref: "#/definitions/show"
    description: >-
      The single chart's show; with panels, defaults of every panel's show (interval,
      show_countdown, countdown_format, args_show, refresh_hidden, style, ...), merged
      key by key.
  interval:
    $ref: "#/definitions/duration"
    description: >-
      Global refresh: when it elapses every panel refreshes and the panels' own timers
      restart. Also the last default of show.interval (after the top-level show.interval).
      At least 1s.
  title:
    type: string
    description: >-
      The dashboard's title: on the header line above the charts, in notifications and
      :DbDashStatus, and meta.dashboard_title.
  description:
    type: string
    description: >-
      The dashboard's description: a template (the shared args; meta without panel fields;
      it cannot assign arguments) whose result is Markdown, shown by K / :DbDashDescribe;
      ⓘ in the header says there is one.
  show_countdown:
    type: boolean
    default: false
    description: Count down to the next refresh of every panel (needs interval), right of the title.
  countdown_format:
    type: string
    description: Text of that countdown ({time} seconds, {clock} m:ss; default setup defaults.countdown_format).
  args:
    type: array
    description: >-
      Shared arguments: every panel can use them. A panel's query.args are its own (only that
      panel sees them) and shadow a shared argument of the same name there. On the command
      line name=value sets every argument of that name, <panel id>.name=value one panel's
      own (a local name nothing else has is plain name too).
    items: { $ref: "#/definitions/arg" }
  layout:
    type: object
    description: Grid layout for panels.
    additionalProperties: false
    properties:
      columns:
        description: >-
          Column tracks (CSS grid-template-columns): a number of equal columns, a string
          ("1fr 2fr 30", "repeat(3, 1fr)") or a list. Tracks: an integer (display columns),
          "N%", "Nfr", auto (1fr) or "minmax(a, b)". Default 1, or the width of areas.
          See :help dbdash-layout.
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string }
          - { type: array, minItems: 1, items: { $ref: "#/definitions/track" } }
      rows:
        description: >-
          The first row tracks (CSS grid-template-rows): an integer (lines), "Nfr", auto
          (minmax(min-content, max-content)), min-content, max-content or "minmax(a, b)".
        oneOf:
          - { type: string }
          - { type: array, items: { $ref: "#/definitions/track" } }
      auto_rows:
        $ref: "#/definitions/track"
        description: Rows past layout.rows (CSS grid-auto-rows; default auto).
      gap: { type: integer, minimum: 0, default: 2, description: Spaces between columns (column-gap). }
      row_gap: { type: integer, minimum: 0, default: 1, description: Blank lines between rows (row-gap). }
      areas:
        type: array
        items: { type: string }
        description: >-
          Named areas (CSS grid-template-areas): one string per row, names separated by
          spaces, "." for an empty cell; each name must be a rectangle. Panels go into one
          with show.area.
  panels:
    type: array
    minItems: 1
    description: Charts placed left to right, wrapping into rows (see show.span).
    items: { $ref: "#/definitions/panel" }
additionalProperties: false

definitions:
  duration:
    description: 'Seconds as a number, or a string with a unit: "500ms", "30s", "5m", "1h".'
    oneOf:
      - { type: number, minimum: 0 }
      - { type: string, pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h)?\\s*$" }

  database:
    type: object
    required: [url]
    additionalProperties: false
    properties:
      type:
        description: Database type; inferred from the URL scheme when omitted.
        enum: [sqlite, sqlite3, postgres, postgresql, mysql, mariadb, redis, rediss, mongodb, cassandra, cql, mssql, sqlserver, lua, http, https, luastream, exec, webhook]
      url:
        type: string
        description: |-
          Connection URL: <scheme>://[user[:password]@]host[:port][/database][?param=value&...]
          User names and passwords are percent-decoded (write @ as %40, : as %3A).
          ${NAME} is replaced by the environment variable NAME ($${ for a literal ${).
          Without a password in the URL: password_cmd, then
          stdpath("data")/dbdash/passwords.json (see :help dbdash-passwords).

          SQLite      sqlite:///absolute/path.db                (or sqlite3://)
                      sqlite://relative/to/this/config.db
                      sqlite:///:memory:
          PostgreSQL  postgres://user:pass@host:5432/db        (or postgresql://)
                      auth: cleartext, md5, SCRAM-SHA-256; ?options=-c%20search_path%3Dapp
          MySQL       mysql://user:pass@host:3306/db           (or mariadb://)
                      auth: mysql_native_password, caching_sha2_password
          Redis       redis://[user]:pass@host:6379/0          (rediss:// = TLS)
          MongoDB     mongodb://user:pass@host:27017/db?authSource=admin
                      mongodb://user:pass@h1:27017,h2:27017/db?readPreference=secondaryPreferred
                      mongodb+srv://user:pass@cluster0.example.net/db   (SRV + TXT lookup,
                      defaults to tls=verify-full; ?dns=host:port picks the name server)
                      ?authMechanism=SCRAM-SHA-256|SCRAM-SHA-1
          Cassandra   cassandra://user:pass@host:9042/keyspace?consistency=LOCAL_QUORUM
                      (or cql://)
          SQL Server  mssql://user:pass@host:1433/db            (or sqlserver://)
                      with TLS: TLS negotiated inside TDS; &encrypt=strict for TDS 8
          Lua         lua://   query.sql is Lua code returning rows (:help dbdash-lua)
          HTTP        https://user:pass@api.example.com/v1?key=value   (or http://)
                      query.sql describes the request (:help dbdash-http); https
                      defaults to tls=verify-full; other ?parameters go to the server

          Push sources: data arrives instead of being queried (:help dbdash-push)
          Lua stream  luastream://   query.sql is Lua whose print() / io.write() output is
                      the data (:help dbdash-luastream)
          Script      exec://        query.sql is a script; its output is the data
                      (:help dbdash-exec)
          Webhook     webhook://127.0.0.1:8765/path   an HTTP endpoint; query.sql is an
                      OpenAPI document (:help dbdash-webhook)

          Common parameters:
            tls=disable|require|pin|verify-ca|verify-full   (default disable)
            fingerprint=sha256:AB:CD:...                    (required for tls=pin)
            ca=path/to/ca.pem                              (verify-*: trusted CAs instead of
                                                            the system store; relative to
                                                            this config file)
            tls_host=name                                  (name to verify instead of host)
            connect_timeout=10s   timeout=30s              (defaults: setup)
            application_name=dbdash.nvim
        examples:
          - "sqlite:///:memory:"
          - "sqlite://data/app.db"
          - "postgres://app:secret@db.internal:5432/app?tls=verify-full"
          - "mysql://report:secret@127.0.0.1:3306/shop?tls=require"
          - "redis://:secret@cache:6379/0"
          - "mongodb+srv://reader:secret@cluster0.example.net/shop"
          - "cassandra://cassandra:cassandra@127.0.0.1:9042/metrics"
          - "mssql://sa:Secret1@sqlhost:1433/master?tls=pin&fingerprint=sha256:AB:..."
          - "lua://"
          - "https://api.example.com/v1?api_key=${API_KEY}"
          - "luastream://"
          - "exec://"
          - "webhook://127.0.0.1:8765/events"
      password_cmd:
        description: >-
          Command printing the password (first line), used when the URL has none. A string
          runs through sh -c (cmd /c on Windows); a list runs directly. It runs in Neovim's
          current directory.
        oneOf:
          - { type: string, minLength: 1 }
          - { type: array, minItems: 1, items: { type: string } }
        examples: ["pass show db/app"]
      options:
        type: object
        description: Driver options.
        properties:
          lib_path: { type: string, description: "SQLite: path of the libsqlite3 library to load." }
          readonly: { type: boolean, description: "SQLite: open the file read-only." }
          create: { type: boolean, description: "SQLite: create the file when it does not exist (default false)." }
          delimiter:
            type: string
            minLength: 1
            description: 'Push sources: what separates items in the output or a streamed request body (default "\n"; a "\r" before it is dropped).'
          cwd:
            type: string
            description: "exec:// and luastream://: the working directory (default: this config file's directory; relative to it)."
          interpreter:
            type: array
            minItems: 1
            items: { type: string }
            description: 'exec://: the program running the script, the script being its last argument (default ["sh", "-c"], ["cmd.exe", "/d", "/s", "/c"] on Windows).'
            examples: [["bash", "-c"], ["python3", "-c"], ["pwsh", "-Command"]]
          capture:
            enum: [stdout, stderr, both]
            description: "exec://: which output is the data (default stdout); each item knows its stream."
          ok_codes:
            type: array
            minItems: 1
            items: { type: integer }
            description: "exec://: exit codes that end normally (default [0]); others fail with the end of stderr."
          env:
            type: object
            additionalProperties: { type: [string, number, boolean] }
            description: "exec://: environment variables added to Neovim's."
          stdin:
            type: string
            description: "exec://: text written to the script's stdin (then closed)."
          tokens:
            type: object
            description: >-
              webhook://: the credentials of the OpenAPI document's security schemes, by scheme
              name: a token (http bearer, apiKey), "user:password" (http basic), or a list of them.
              Use ${NAME} to read them from the environment.
          stream_types:
            type: array
            items: { type: string }
            description: "webhook://: more media types whose bodies are cut into items at the delimiter."
          max_body:
            type: [string, integer]
            description: 'webhook://: the largest request body (default "10MB"; larger ones get 413).'
          max_connections:
            type: integer
            minimum: 1
            description: "webhook://: connections at the same time (default 16; more are closed)."
          timeout:
            $ref: "#/definitions/duration"
            description: "webhook://: time to send the headers and each part of the body (default 10s; then 408)."
          allowed_origins:
            type: array
            items: { type: string }
            description: "webhook://: Origin values accepted (browsers send one; default none). Requests without an Origin are accepted."
          allowed_hosts:
            type: array
            items: { type: string }
            description: "webhook://: more Host names accepted besides the listening address and localhost."

  arg:
    type: object
    required: [name]
    additionalProperties: false
    not:
      required: [key]
      description: "'key:' is not supported; use 'name:'."
    properties:
      name:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: Argument name, used as args.<name> in templates and Lua code.
      type:
        enum: [string, number, int, boolean, list, map]
        default: string
        description: >-
          How command-line / prompt input is parsed: list "a,b,c", map "k:v,k2:v2", boolean
          true/false/1/0/yes/no. Escape , and : with a backslash or quotes.
      default:
        description: Value when nothing else sets it (an argument without a value is none).
      required:
        type: boolean
        default: false
        description: Ask for a value at start when it has none.
      show:
        type: boolean
        default: true
        description: Include the argument in show.args_show lines (when args_show is true).
      description: { type: string }
      choices:
        type: array
        description: Candidates for completion and prompts.

  query:
    type: object
    description: >-
      The query; sql is required except for http(s):// (an empty request GETs the URL) and
      webhook:// (empty: POST or PUT of anything).
    additionalProperties: false
    properties:
      sql:
        type: string
        description: |-
          Query template (Jinja2, see :help dbdash-templates): arguments are
          {{ args.<name> }}, metadata {{ meta.<name> }} (:help dbdash-meta, e.g.
          run records with ids, times and results: meta.run (meta.run.kind: "refresh" or
          "callback"; meta.run.depth: 0 in a refresh, n in a callback), meta.runs,
          meta.prev, meta.prev_ok (the last successful refresh, its rows in
          meta.prev_ok.result): :help dbdash-runs), and
          {% set args.<name> = value %} sets an argument (:help dbdash-assign-args). Lua
          runs in {% lua %} ... {% endlua %} blocks and in modules imported with
          {% import 'x.lua' as h %} (:help dbdash-template-lua), with args, meta, store and
          the dbdash.* helpers (dbdash.run(args): this query again with other arguments);
          a config with Lua is trusted once, with the files it imports (:help dbdash-lua).
          Its language depends on the database:
            SQL databases  SQL (T-SQL for SQL Server, CQL for Cassandra)
            Redis          one command, e.g. HGETALL "user:1001"
            MongoDB        a JSON document:
                           {"collection": "orders", "operation": "find",
                            "filter": {...}, "projection": {...}, "sort": {...},
                            "limit": 100, "flatten": 1}
                           operation: find | aggregate (pipeline) | count |
                           distinct (field) | command (command)
            lua://         Lua code returning rows (see "Result format" at the top
                           of this file, :help dbdash-result), or a value that
                           query.transform turns into rows; it sees args, meta,
                           store and dbdash.system/query/sleep/run (:help
                           dbdash-lua)
            luastream://   Lua code whose print() / io.write() output is cut into
                           items (dbdash.emit(value) passes one as it is)
            exec://        a script run by database.options.interpreter
            webhook://     an OpenAPI 3.1 document (YAML or JSON) describing the
                           requests it accepts (empty: POST or PUT of anything)
            http(s)://     a JSON request description (empty: GET the URL):
                           {"method": "POST", "path": "/search", "query": {...},
                            "headers": {...}, "cookies": "a=1; b=2" | "cookies.txt",
                            "body": {...} | "text", "form": {...}, "redirects": 5}
                           JSON responses are decoded, other bodies stay text; the
                           result must be rows ("Result format", :help
                           dbdash-result): a JSON list of objects or {"columns",
                           "rows"} shows directly, anything else needs
                           query.transform (:help dbdash-http)
      transform:
        type: string
        description: |-
          Lua code that reshapes the result of any database before it is shown (after the
          same template as query.sql - args, meta, {% lua %}, .lua imports - without
          autoescape; :help dbdash-transform). Every query goes:
          query -> transform -> rows check. It gets
            rs        SQL and other databases: { columns (names), types, rows (nil for
                      NULL) }; lua://: the script's value; http(s)://: the decoded body;
                      push sources: one item (text, or what dbdash.emit() or a request
                      gave; :help dbdash-push)
            response  http(s)://: { status, reason, headers, body, url }
            stream    exec://: "stdout" or "stderr", the stream the item came from
            params    webhook://: { path, query, header, cookie }, converted
            request   webhook://: { method, path, operation_id, content_type, headers }
            args      the arguments, meta the metadata, store the panel's table kept while
                      the dashboard runs, and the dbdash.* helpers (dbdash.run(args)
                      runs this panel's query again with other arguments)
          and returns rows (see "Result format" at the top of this file, :help
          dbdash-result). Configs with Lua ask for trust first (:help dbdash-lua).
      args:
        type: array
        description: >-
          This chart's own arguments (only its templates see them); one with the name of a
          shared (top-level) argument shadows it here.
        items: { $ref: "#/definitions/arg" }
      autoescape:
        type: boolean
        default: false
        description: "Render {{ x }} as SQL literals of the database's dialect (| safe opts out)."
      max_rows:
        type: integer
        minimum: 1
        default: 10000
        description: Rows read at most (default 10000, setup defaults.max_rows).
      timeout:
        $ref: "#/definitions/duration"
        description: Query timeout (default the URL's timeout, else 30s from setup defaults.timeout).

  panel:
    type: object
    description: One chart; query is required except for http(s):// (a GET of the URL) and webhook://.
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: >-
          Name of the panel for its local arguments on the command line (<id>.name=value);
          default its number (1, 2, ...).
      database:
        $ref: "#/definitions/database"
        description: >-
          This panel's database; default the top-level database (replaced as a whole). A
          panel needs one of the two.
      query: { $ref: "#/definitions/query" }
      show: { $ref: "#/definitions/show" }

  series:
    oneOf:
      - type: string
      - type: object
        required: [column]
        properties:
          column: { type: string }
          label: { type: string }
          color: { $ref: "#/definitions/color" }

  track:
    description: 'A grid track: an integer, "N%", "Nfr", auto, min-content, max-content or "minmax(a, b)".'
    oneOf:
      - { type: integer, minimum: 0 }
      - { type: string }

  color:
    type: string
    description: >-
      Hex ("#3498db"), a color name ("blue", "bright_blue"), a style ("bold blue on black"),
      or an existing highlight group ("DiagnosticOk").

  show:
    type: object
    properties:
      type:
        enum: [table, line, area, bar, histogram, boxplot, heatmap, bubble, pie, scatter, stat, text]
        default: table
      title: { type: string }
      subtitle: { type: string, description: "A muted line under the title (Chart.js subtitle)." }
      description:
        type: string
        description: >-
          This chart's description: a template (args, meta, as its query sees them; it
          cannot assign arguments) whose result is Markdown, shown by K / :DbDashDescribe;
          ⓘ after the panel's title (in a one-chart dashboard: in the header) says there is
          one. With panels, it belongs in each panel.
      interval:
        $ref: "#/definitions/duration"
        description: >-
          Refresh interval of this chart (default the top-level show.interval, then the
          top-level interval, else 30s from setup defaults.interval). At least 1s.
      show_countdown: { type: boolean, default: false, description: "This chart's own countdown to its next refresh." }
      refresh_hidden:
        type: boolean
        default: false
        description: >-
          Keep refreshing this chart while the dashboard is not visible (paused, see
          dashboard.pause_hidden in setup): thresholds and errors still notify.
      countdown_format:
        type: string
        default: "Next update: {time}s"
        description: "{time} is replaced by the seconds left, {clock} by m:ss (default: setup defaults.countdown_format)."
      renderer:
        type: string
        description: |-
          Style for the chart type (the first one is the default):
            table: box          line: canvas, asciichart     scatter/area/bubble: canvas
            bar: horizontal, vertical    histogram: horizontal, vertical
            boxplot: boxdraw    heatmap: halfblock, block    pie: bar, circle
            stat: big           text: plain
          Custom styles registered with setup({ register = ... }) are accepted too.
      canvas:
        type: string
        description: "Pixel canvas for canvas styles: braille (default), quadrant, block, halfblock, ascii."
      palette:
        type: string
        description: "Series colors: theme (default, follows the colorscheme) or tableau."
      width: { type: integer, minimum: 20, description: Maximum chart width (default the window). }
      height: { type: integer, minimum: 3, description: "Plot rows (default: setup defaults.height, else 15)." }
      span: { type: integer, minimum: 1, default: 1, description: Grid columns this panel spans. }
      row_span: { type: integer, minimum: 1, default: 1, description: Grid rows this panel spans. }
      row: { type: integer, minimum: 1, description: "Grid row of this panel (CSS grid-row; 1-based)." }
      column: { type: integer, minimum: 1, description: "Grid column of this panel (CSS grid-column; 1-based)." }
      area: { type: string, description: "A name of layout.areas to place this panel in (CSS grid-area)." }
      min_height:
        type: integer
        minimum: 1
        description: "Smallest plot rows in a grid before it scrolls (default: setup defaults.min_height, else 8)."
      args_show:
        description: >-
          Show argument values above this chart: true for the arguments its query reads (and
          its own query.args; not those with show: false), or a list of names.
        oneOf:
          - type: boolean
          - { type: array, items: { type: string } }
        default: false
      style:
        type: object
        description: |-
          Styles, after CSS (:help dbdash-css); every chart type takes the common ones:
            color, background, title_style, title_align, header_style, axis_style,
            label_style, legend_style, value_style, null_style, border_style, border,
            panel_border, padding, justify, align, ellipsis, show_title, show_axes
          Chart options:
            table      border, header_style, border_style, title_style, show_lines, null_text,
                       wrap (true: long cells wrap at spaces; "char": anywhere; false: one
                       line cut with "…"), cell_width / cell_height (every column's width
                       and most lines per cell; a cell still too long ends with "…")
            area       stacked
            bar        color, show_values
            histogram  color, show_values
            boxplot    show_outliers, show_means
            heatmap    show_values (block renderer)
            pie        show_labels, show_values, show_percentages
            text       separator (" "), null_text (""), wrap (true: at spaces; "char":
                       anywhere; false cuts long lines), title_style
        properties:
          color: { type: string, description: "The data's color (CSS color): bars, the first series, stat value, text." }
          background: { type: string, description: "The panel's background color (CSS background-color)." }
          title_style: { type: string, description: 'Title color and attributes, e.g. "bold #e5c07b".' }
          title_align: { enum: [left, center, right], description: "Title position (CSS text-align)." }
          header_style: { type: string, description: "Table header color." }
          axis_style: { type: string, description: "Tick labels." }
          label_style: { type: string, description: "Axis titles and category labels." }
          legend_style: { type: string, description: "Legend labels." }
          value_style: { type: string, description: "Value labels (bars, pie)." }
          null_style: { type: string, description: "NULL cells." }
          border_style: { type: string, description: "Border color (CSS border-color)." }
          border:
            description: "Plot and table border line (CSS border-style): single, rounded, heavy, double, dashed, ascii, none; true / false."
            oneOf:
              - type: boolean
              - enum: [single, rounded, heavy, double, dashed, ascii, none]
          panel_border:
            description: "A box around the whole panel, the title in its top line (CSS border on the panel)."
            oneOf:
              - type: boolean
              - enum: [single, rounded, heavy, double, dashed, ascii, none]
          padding:
            description: "Space inside the panel (CSS padding): N, [vertical, horizontal], [top, horizontal, bottom] or [top, right, bottom, left]."
            oneOf:
              - { type: integer, minimum: 0 }
              - { type: array, minItems: 1, maxItems: 4, items: { type: integer, minimum: 0 } }
          justify: { enum: [start, center, end, stretch], description: "Where the chart sits across its cell (CSS justify-self)." }
          align: { enum: [start, center, end], description: "Where the chart sits down its cell (CSS align-self)." }
          ellipsis: { type: string, description: 'What marks cut text (CSS text-overflow; default "…").' }
          show_title: { type: boolean, description: "false hides the title (CSS display: none)." }
          show_axes: { type: boolean, description: "false hides tick labels and axis titles." }
          wrap:
            description: 'Long text wraps at spaces (true), anywhere ("char") or is cut (false).'
            oneOf:
              - type: boolean
              - const: char
          cell_width: { type: integer, minimum: 1, description: "table: every column's width." }
          cell_height: { type: integer, minimum: 1, description: "table: most lines per cell." }
          cell_padding: { type: integer, minimum: 0, description: "table: spaces each side of a cell (default 1)." }
          vertical_align: { enum: [top, middle, bottom], description: "table: a short cell in a taller row." }
          striped: { type: string, description: "table: background of every other row (CSS :nth-child(even))." }
          stacked:
            description: "area: stack the series (true), or stack them to 100% (percent)."
            oneOf:
              - type: boolean
              - const: percent
          group: { enum: [grouped, stacked], description: "bar: several series side by side (default) or stacked." }
          bar_width: { type: integer, minimum: 1, description: "bar: columns (vertical) or lines (horizontal) per bar." }
          bar_gap: { type: integer, minimum: 0, description: "bar: columns or lines between categories." }
          top: { type: integer, minimum: 1, description: "bar: keep the first N bars (after sort)." }
          value_position: { enum: [end, inside], description: "bar: the value after / above the bar (end) or inside its end." }
          cumulative: { type: boolean, description: "histogram: add the bins up." }
          normalize: { enum: [count, percent, density], description: "histogram: counts, shares of all values, or density." }
          trend_line: { const: linear, description: "scatter, bubble, line: a dashed least-squares line per series." }
          point: { type: string, description: "scatter, bubble: a character for every point instead of a dot." }
          size_range:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: 0 }
            description: "bubble: smallest and largest radius, in canvas pixels."
          caption: { enum: [top, bottom], description: "Where the title goes (CSS caption-side; default top)." }
          sort:
            description: 'table: order the rows (DataTables order): a column name, or { column, order: asc | desc }; NULLs last. bar: asc or desc by value.'
            oneOf:
              - type: string
              - type: object
                properties:
                  column: { type: string }
                  order: { enum: [asc, desc] }
          max_rows_shown: { type: integer, minimum: 1, description: "table: show the first N rows, then how many more." }
          row_thresholds:
            type: object
            description: "table: color whole rows by one column's value (AG Grid rowStyle)."
            properties:
              column: { type: string }
              steps: { $ref: "#/definitions/thresholds" }
              below: { type: boolean, description: "Steps apply at or below their value." }
      colors:
        description: Series / slice colors, by position (list) or by category name (mapping).
        oneOf:
          - type: array
            items: { $ref: "#/definitions/color" }
          - type: object
            additionalProperties: { $ref: "#/definitions/color" }
      legend:
        oneOf:
          - type: boolean
          - type: object
            properties:
              show: { type: boolean }
              position: { type: string, description: "right (default) or bottom." }
      axes:
        type: object
        properties:
          x_axis: { $ref: "#/definitions/axis" }
          y_axis: { $ref: "#/definitions/axis" }
      x_label: { type: string }
      y_label: { type: string }
      x_column: { type: string }
      y_column: { type: string }
      y_columns:
        type: array
        items: { $ref: "#/definitions/series" }
      line_style:
        type: object
        properties:
          fill_area: { type: boolean }
          show_points: { type: boolean }
          stepped:
            description: "Steps instead of slopes (Chart.js stepped): true (= before), before, after, middle."
            oneOf:
              - type: boolean
              - enum: [before, after, middle]
          point: { type: string, description: 'A character marking every point (Chart.js pointStyle), e.g. "●", "×".' }
          span_gaps: { type: boolean, default: true, description: "false: a NULL breaks the line (Chart.js spanGaps)." }
      mark_lines:
        type: array
        description: "Reference lines (ECharts markLine): a value, or mean / min / max of the data."
        items:
          type: object
          properties:
            value: { anyOf: [{ type: number }, { enum: [mean, average, min, max] }, { type: string }], description: "A number, mean, min, max, or (x axis) a category." }
            axis: { enum: [x, y], default: y }
            label: { type: string }
            color: { $ref: "#/definitions/color" }
      mark_points:
        type: array
        description: "Mark each series' max / min point with its value (ECharts markPoint)."
        items: { enum: [max, min] }
      value_column: { type: string, description: "histogram, boxplot, heatmap, pie; stat: the value (default the first numeric column)." }
      category_column: { type: string }
      label_column: { type: string }
      size_column: { type: string }
      color_column: { type: string }
      bins: { type: integer, minimum: 1 }
      bin_width: { type: number, exclusiveMinimum: 0, description: "histogram: the width of every bin (Vega-Lite bin.step)." }
      bin_range:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number }
        description: "histogram: where the bins start and end (Vega-Lite bin.extent)."
      format:
        type: string
        description: 'stat: Python format of the value, e.g. "{:,}", "{:.1f}", "{:.1%}".'
      unit: { type: string, description: "stat: text shown after the value." }
      delta: { type: boolean, default: true, description: "stat: show the change since the previous refresh." }
      sparkline: { type: boolean, default: true, description: "stat: show the last 20 values." }
      thresholds:
        $ref: "#/definitions/thresholds"
        description: "stat: color the value by thresholds; notify: true notifies when the value rises to a step."
      thresholds_below: { type: boolean, default: false, description: "Thresholds apply at or below their value (lower is worse)." }
      column_list:
        type: array
        description: Table (and text) columns to show, in order (all columns when omitted).
        items:
          oneOf:
            - type: string
            - type: object
              required: [column]
              properties:
                column: { type: string }
                alias: { type: string }
                width: { type: integer, minimum: 1, description: "Column width (cells wrap inside it)." }
                height: { type: integer, minimum: 1, description: "Most lines a cell takes; longer ends with …" }
                align: { enum: [left, center, right], description: "Text alignment (default: numbers right)." }
                format: { type: string, description: 'Python format of numbers, e.g. "{:,.2f}", "{:.1%}".' }
                style: { type: string, description: "Color of the column's cells." }
                thresholds:
                  $ref: "#/definitions/thresholds"
                  description: Color the cells of this column by value (notify works as for stat).
                thresholds_below: { type: boolean, default: false }
    allOf:
      - if: { properties: { type: { enum: [line, area, bar] } }, required: [type] }
        then:
          required: [x_column]
          anyOf: [{ required: [y_column] }, { required: [y_columns] }]
      - if: { properties: { type: { enum: [scatter, bubble] } }, required: [type] }
        then: { required: [x_column, y_column] }
      - if: { properties: { type: { enum: [histogram, boxplot] } }, required: [type] }
        then: { required: [value_column] }
      - if: { properties: { type: { const: heatmap } }, required: [type] }
        then: { required: [x_column, y_column, value_column] }
      - if: { properties: { type: { const: pie } }, required: [type] }
        then: { required: [label_column, value_column] }

  thresholds:
    type: array
    description: >-
      Steps from least to most severe; a value at or above a step's value (at or below with
      thresholds_below) reaches it and the most severe step reached wins.
    items:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: number }
        color: { $ref: "#/definitions/color" }
        notify: { type: boolean, default: false, description: "vim.notify once when the value rises to this step." }

  axis:
    type: object
    properties:
      title: { type: string }
      min_value: { type: number }
      max_value: { type: number }
      scale: { enum: [linear, log], default: linear, description: "log: one tick per power of ten (Chart.js type: logarithmic)." }
      ticks: { type: integer, minimum: 2, description: "About how many ticks (Chart.js ticks.count)." }
      grid: { type: boolean, default: false, description: "Grid lines at the ticks (Chart.js grid.display)." }
      format: { type: string, description: 'Python format, e.g. "{:,.0f}" or "{:.1%}".' }
