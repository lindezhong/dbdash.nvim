# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Heat map: activity per weekday and hour.
# The default halfblock style packs two rows per line; `renderer: block` uses one line per
# row and can print the values (style.show_values).

database:
  url: "sqlite:///:memory:"

query:
  sql: |
    WITH RECURSIVE hours AS (
      SELECT 0 AS hour
      UNION ALL
      SELECT hour + 1 FROM hours WHERE hour < 23
    ),
    days AS (
      SELECT 'Monday' AS day, 1 AS day_order
      UNION SELECT 'Tuesday', 2
      UNION SELECT 'Wednesday', 3
      UNION SELECT 'Thursday', 4
      UNION SELECT 'Friday', 5
      UNION SELECT 'Saturday', 6
      UNION SELECT 'Sunday', 7
    )
    SELECT
      day,
      hour,
      abs(random() % 100) +
        CASE
          WHEN hour BETWEEN 9 AND 17 THEN 50
          WHEN hour BETWEEN 18 AND 22 THEN 30
          ELSE 10
        END AS activity_level
    FROM days CROSS JOIN hours
    ORDER BY day_order, hour

show:
  type: heatmap
  title: "Weekly activity"
  interval: 60s

  x_column: hour
  y_column: day
  value_column: activity_level

  style:
    show_values: true                # used by the block renderer

  show_countdown: true
  countdown_format: "Next update: {time}s"
