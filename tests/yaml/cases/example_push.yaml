# yaml-language-server: $schema=./dbdash.schema.yaml
#
# Push sources: data arrives instead of being queried (:help dbdash-push). Their output is
# cut into items (one per line by default); each item goes through query.transform (or
# must be JSON rows) one at a time, and the panel is drawn on its interval when something
# is new.
# - luastream://: Lua whose print() output is the data; it stops when the code ends.
# - exec://: a script whose stdout (and here stderr) is the data; the interpreter is
#   Neovim running lua/run.lua so the example works everywhere (sh -c by default).
# - webhook://: an HTTP endpoint described by an OpenAPI document. Push events with
#     curl -H "Authorization: Bearer demo-token" -H "Content-Type: application/x-ndjson" \
#          --data-binary $'{"user": "ann", "action": "login"}\n' http://127.0.0.1:8765/events/web
#   (a real token belongs in the environment: tokens: { bearer: "${EVENTS_TOKEN}" }).
# They run code and commands, so dbdash asks whether you trust this file first.

title: "Push sources"

layout:
  columns: 2

panels:
  - database: { url: "luastream://" }
    query:
      sql: |
        -- One reading per second for a minute, as JSON lines.
        for i = 1, 60 do
          print(vim.json.encode({ at = os.date("%H:%M:%S"), load = 40 + math.random(0, 30) }))
          dbdash.sleep(1000)
        end
      transform: |
        -- Each item is one line; keep the last 30 readings in store to draw them.
        store.points = store.points or {}
        table.insert(store.points, vim.json.decode(rs))
        while #store.points > 30 do table.remove(store.points, 1) end
        return store.points
    show:
      type: line
      title: "luastream: one reading per second"
      x_column: at
      y_column: load
      interval: 2s

  - database:
      url: "exec://"
      options:
        interpreter: ["nvim", "--clean", "-l", "lua/run.lua"]
        capture: both
    query:
      sql: |
        -- A script writing log lines (stdout) and warnings (stderr) for 30 seconds.
        for i = 1, 30 do
          if i % 7 == 0 then
            io.stderr:write(("disk %d%% full\n"):format(80 + i % 20))
          else
            io.write(("job %d done in %d ms\n"):format(i, math.random(5, 90)))
          end
          io.stdout:flush()
          vim.uv.sleep(1000)
        end
      transform: |
        store.lines = store.lines or {}
        table.insert(store.lines, 1, { at = os.date("%H:%M:%S"), stream = stream, line = rs })
        while #store.lines > 10 do table.remove(store.lines) end
        return { columns = { "at", "stream", "line" }, rows = vim.tbl_map(function(l)
          return { l.at, l.stream, l.line }
        end, store.lines) }
    show:
      type: table
      title: "exec: the last lines of a script"
      interval: 1s

  - database:
      url: "webhook://127.0.0.1:8765"
      options:
        tokens: { bearer: "demo-token" }
    query:
      sql: |
        openapi: 3.1.0
        info: { title: events, version: "1" }
        security: [ { bearer: [] } ]
        paths:
          /events/{source}:
            post:
              parameters:
                - { name: source, in: path, required: true, schema: { type: string, enum: [web, app] } }
              requestBody:
                required: true
                content:
                  application/x-ndjson:
                    schema: { $ref: "openapi/events.yaml#/Event" }
              responses: { "202": { description: queued } }
        components:
          securitySchemes:
            bearer: { type: http, scheme: bearer }
      transform: |
        -- rs: one event (decoded and checked); params: the request's parameters.
        store.events = store.events or {}
        table.insert(store.events, 1, { os.date("%H:%M:%S"), params.path.source, rs.user, rs.action })
        while #store.events > 10 do table.remove(store.events) end
        return { columns = { "at", "source", "user", "action" }, rows = store.events }
    show:
      type: table
      title: "webhook: events pushed over HTTP"
      span: 2
