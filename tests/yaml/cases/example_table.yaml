# yaml-language-server: $schema=./dbdash.schema.yaml
#
# Table: a small status board with generated data.
# Shows column_list (selection, aliases, widths), table styles, arguments in the query,
# and the countdown.

database:
  url: "sqlite:///:memory:"          # in-memory database, no file needed

query:
  # Generated data, no tables required. {{ key1 }} / {{ key2 }} come from args below.
  sql: |
    SELECT
      datetime('now', 'localtime') AS current_time,
      abs(random() % 100) AS random_number,
      abs(random() % 1000) AS sales_amount,
      CASE abs(random() % 3)
        WHEN 0 THEN 'Active'
        WHEN 1 THEN 'Pending'
        ELSE 'Inactive'
      END AS status,
      'User' || (abs(random() % 10) + 1) AS username,
      {{ key1 | sql_quote }} AS k1,
      {{ key2 | sql_quote }} AS k2
  args:
    - name: key1
      default: value1
    - name: key2
      default: value2

show:
  type: table
  title: "System status"
  interval: 30s

  # Columns to show, in order; alias renames the header, width fixes the column width.
  column_list:
    - column: current_time
      alias: "Time"
      width: 20
    - column: random_number
      alias: "Random"
      width: 10
      # Color cells by value: >= 50 yellow, >= 90 red (thresholds_below: true reverses).
      thresholds:
        - { value: 50, color: yellow }
        - { value: 90, color: red }
    - column: sales_amount
      alias: "Sales"
      width: 12
    - column: status
      alias: "Status"
      width: 10
    - column: username
      alias: "User"
      width: 12
    - column: k1
    - column: k2

  style:
    border: true                     # box borders (false: plain columns)
    header_style: bold blue          # color spec: hex, name, "bold blue on black", or a highlight group
    show_lines: false                # lines between rows

  show_countdown: true
  countdown_format: "Next update: {time}s"
