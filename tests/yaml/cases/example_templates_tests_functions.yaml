# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Tests (`x is name`), global functions and expressions (:help dbdash-templates), as in
# Jinja2. Each panel is a table of what an expression gives.

title: "Tests, functions, expressions"

database:
  url: "sqlite:///:memory:"

show:
  interval: 1h

layout:
  columns: 2

panels:
  - query:
      sql: |
        {% from 'parts/show.sql' import show %}
        {% macro m() %}{% endmacro %}
        {{ show("x is defined / undefined", (args is defined) ~ ' ' ~ (nothing_here is undefined)) }}
        UNION ALL {{ show("none is none, true is true, false is false", (none is none) ~ ' ' ~ (true is true) ~ ' ' ~ (false is false)) }}
        UNION ALL {{ show("true is boolean, 1 is boolean", (true is boolean) ~ ' ' ~ (1 is boolean)) }}
        UNION ALL {{ show("1 is integer, 1.0 is float, 2 is number", (1 is integer) ~ ' ' ~ (1.0 is float) ~ ' ' ~ (2 is number)) }}
        UNION ALL {{ show("3 is odd, 4 is even, 9 is divisibleby 3", (3 is odd) ~ ' ' ~ (4 is even) ~ ' ' ~ (9 is divisibleby 3)) }}
        UNION ALL {{ show("'a' is string, {} is mapping, [] is sequence, 'x' is iterable", ('a' is string) ~ ' ' ~ ({} is mapping) ~ ' ' ~ ([] is sequence) ~ ' ' ~ ('x' is iterable)) }}
        UNION ALL {{ show("'abc' is lower, 'ABC' is upper", ('abc' is lower) ~ ' ' ~ ('ABC' is upper)) }}
        UNION ALL {{ show("m is callable, 'x' | safe is escaped", (m is callable) ~ ' ' ~ ('x' | safe is escaped)) }}
        UNION ALL {{ show("none is sameas none, 2 is in [1, 2]", (none is sameas none) ~ ' ' ~ (2 is in [1, 2])) }}
        UNION ALL {{ show("'upper' is filter, 'odd' is test", ('upper' is filter) ~ ' ' ~ ('odd' is test)) }}
        UNION ALL {{ show("3 is eq 3, ne, gt, ge, lt, le", (3 is eq 3) ~ (3 is ne 4) ~ (3 is gt 2) ~ (3 is ge 3) ~ (3 is lt 4) ~ (3 is le 3)) }}
        UNION ALL {{ show("3 is equalto 3, greaterthan 2, lessthan 4", (3 is equalto 3) ~ (3 is greaterthan 2) ~ (3 is lessthan 4)) }}
        UNION ALL {{ show("x is not none", 1 is not none) }}
        UNION ALL {{ show("range(6) | select('>', 2) / ('==', 1) / ('<=', 1) / ('!=', 0) / ('>=', 5) / ('<', 1)", (range(6) | select('>', 2) | list) ~ (range(6) | select('==', 1) | list) ~ (range(6) | select('<=', 1) | list) ~ (range(3) | select('!=', 0) | list) ~ (range(6) | select('>=', 5) | list) ~ (range(6) | select('<', 1) | list)) }}
    show:
      type: table
      title: "tests: x is name"
      span: 2

  - query:
      sql: |
        {% from 'parts/show.sql' import show %}
        {{ show("range(3), range(1, 10, 3), range(3, 0, -1)", (range(3) | list) ~ (range(1, 10, 3) | list) ~ (range(3, 0, -1) | list)) }}
        UNION ALL {{ show("dict(a=1, b=2)", dict(a=1, b=2)) }}
        {% set c = cycler('red', 'green') %}
        UNION ALL {{ show("cycler: c.next(), c.next(), c.next(), c.current", c.next() ~ ' ' ~ c.next() ~ ' ' ~ c.next() ~ ' ' ~ c.current) }}
        {% do c.reset() %}
        UNION ALL {{ show("c.reset(); c.current", c.current) }}
        {% set j = joiner(' | ') %}
        {% set out %}{% for x in ['a', 'b', 'c'] %}{{ j() }}{{ x }}{% endfor %}{% endset %}
        UNION ALL {{ show("joiner(' | ')", out) }}
        {% set ns = namespace(n=1) %}{% set ns.n = ns.n * 10 %}
        UNION ALL {{ show("namespace(n=1); set ns.n = ns.n * 10", ns.n) }}
        UNION ALL {{ show("lipsum(1, html=false, min=5, max=6) | wordcount", lipsum(1, html=false, min=5, max=6) | wordcount) }}
    show:
      type: table
      title: "global functions"

  - query:
      sql: |
        {% from 'parts/show.sql' import show %}
        {{ show("7 // 2, -7 // 2, 7 % 3, 2 ** 10", (7 // 2) ~ ' ' ~ (-7 // 2) ~ ' ' ~ (7 % 3) ~ ' ' ~ (2 ** 10)) }}
        UNION ALL {{ show("4 / 2 (a float), 1e3, 0x1f, 1_000", (4 / 2) ~ ' ' ~ 1e3 ~ ' ' ~ 0x1f ~ ' ' ~ 1_000) }}
        UNION ALL {{ show("'a' ~ 1 ~ none, 'ab' * 2, [1] + [2]", ('a' ~ 1 ~ none) ~ ' ' ~ ('ab' * 2) ~ ' ' ~ ([1] + [2])) }}
        UNION ALL {{ show("1 < 2 < 3, 'b' in 'abc', 1 not in [2]", (1 < 2 < 3) ~ ' ' ~ ('b' in 'abc') ~ ' ' ~ (1 not in [2])) }}
        UNION ALL {{ show("none or 'x', 0 and 1, not ''", (none or 'x') ~ ' ' ~ (0 and 1) ~ ' ' ~ (not '')) }}
        UNION ALL {{ show("(1, 2), (1,), {'k': [1, 2.0]}", (1, 2) ~ ' ' ~ (1,) ~ ' ' ~ {'k': [1, 2.0]}) }}
        UNION ALL {{ show("'hello'[1:4], 'hello'[::-1], [1, 2, 3, 4][::2], [1, 2, 3][-1]", 'hello'[1:4] ~ ' ' ~ 'hello'[::-1] ~ ' ' ~ [1, 2, 3, 4][::2] ~ ' ' ~ [1, 2, 3][-1]) }}
        UNION ALL {{ show("'%s=%05.1f|%-4s|%x' % ('a', 3.14159, 'b', 255)", '%s=%05.1f|%-4s|%x' % ('a', 3.14159, 'b', 255)) }}
        UNION ALL {{ show("'%(n)d%%' % {'n': 50}", '%(n)d%%' % {'n': 50}) }}
        UNION ALL {{ show("'{:>6}|{:<4}|{:^7}|{:,}|{:.1%}|{!r}'.format(...)", '{:>6}|{:<4}|{:^7}|{:,}|{:.1%}|{!r}'.format('r', 'l', 'c', 1234567, 0.25, 'q')) }}
        UNION ALL {{ show("'{0}-{name}-{0}'.format('a', name='n')", '{0}-{name}-{0}'.format('a', name='n')) }}
    show:
      type: table
      title: "expressions: numbers, strings, tuples, slices, formatting"
