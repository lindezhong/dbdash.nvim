# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Area chart: every canvas and option, one panel each (press K on a panel). An area is a
# line filled down to zero; several series stack (show.stacked) or overlap. The line
# options (axes, mark_lines, the legend, ...) work here too, see line.yaml.

title: "Area chart"
description: |
  An area chart fills under each series: `x_column` and `y_columns` (or `y_column`,
  `series_column`). `stacked: true` piles the series up, `stacked: percent` scales every
  x to 100%. Colors are style rules: `series.<label> { color }` here, for every panel.
  See `:help dbdash-charts` and `:help dbdash-css`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }
  # the series by their labels, in every panel (series:nth-child(N) goes by position)
  "series.Desktop": { color: "#61afef" }
  "series.Mobile": { color: "#e06c75" }
  "series.Tablet": { color: "#98c379" }

panels:
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "stacked: true (canvas braille)"
      description: |
        `stacked: true` piles the series up, each on the one before (ECharts `stack`); the
        top line is the total. Braille draws 2 x 4 dots per character.
      x_column: month
      y_columns:
        - { column: desktop, label: Desktop }
        - { column: mobile, label: Mobile }
        - { column: tablet, label: Tablet }
      stacked: true
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "stacked: percent"
      description: |
        `stacked: percent` scales every month to 100% (a 100% stacked area): the share of each
        series, not its size.
      x_column: month
      y_columns:
        - { column: desktop, label: Desktop }
        - { column: mobile, label: Mobile }
        - { column: tablet, label: Tablet }
      axes:
        y_axis: { max_value: 100, format: "{:.0f}%" }
      stacked: percent
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "overlapping (stacked: false), axes.y_axis.max_value"
      description: |
        Without `stacked` the areas overlap, the first series in front. `axes.y_axis`
        `min_value` / `max_value` fix the scale so refreshes do not rescale it.
      x_column: month
      y_columns:
        - { column: desktop, label: Desktop }
        - { column: mobile, label: Mobile }
        - { column: tablet, label: Tablet }
      axes:
        y_axis: { min_value: 0, max_value: 100 }
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "chart { canvas: quadrant }"
      description: "`chart { canvas: quadrant }`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      x_column: month
      y_column: mobile
    style:
      chart: { canvas: quadrant }
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "chart { canvas: block }"
      description: "`chart { canvas: block }`: one full block per pixel: coarse but bold."
      x_column: month
      y_column: mobile
    style:
      chart: { canvas: block }
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "chart { canvas: halfblock }"
      description: "`chart { canvas: halfblock }`: 1 x 2 pixels per character (▀ ▄)."
      x_column: month
      y_column: mobile
    style:
      chart: { canvas: halfblock }
  - query:
      sql: |
        WITH RECURSIVE m(n) AS (SELECT 1 UNION ALL SELECT n + 1 FROM m WHERE n < 12)
        SELECT substr('JanFebMarAprMayJunJulAugSepOctNovDec', n * 3 - 2, 3) AS month,
               30 + abs(random() % 30) AS desktop, 40 + abs(random() % 40) AS mobile,
               10 + abs(random() % 15) AS tablet
        FROM m
    show:
      type: area
      title: "chart { canvas: ascii }"
      description: "`chart { canvas: ascii }`: plain ASCII, for any terminal or font."
      x_column: month
      y_column: mobile
    style:
      chart: { canvas: ascii }
