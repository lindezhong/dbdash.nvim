# yaml-language-server: $schema=../dbdash.schema.yaml
#
# webhook:// - an HTTP endpoint described by an OpenAPI 3.1 document in query.sql
# (:help dbdash-webhook, dbdash-webhook-security, dbdash-push). The description below
# (K in the dashboard) has curl commands that send data to every endpoint.
#
# Tokens: the document's security schemes (components.securitySchemes) name the ways a
# request may prove itself - here a bearer token, an API key header or Basic user:password,
# any one of them (security lists alternatives) - and database.options.tokens gives the
# accepted credentials of each by scheme name. A list accepts several (to rotate them). A
# real token belongs in the environment, not in this file:
#   tokens: { bearer: "${EVENTS_TOKEN}" }      then: EVENTS_TOKEN=... nvim
# Rejected requests get application/problem+json (401 without a valid credential, 400 for
# an invalid event, 403 for an Origin not in allowed_origins, ...). The document's paths
# are appended to the URL's path (/hooks).

title: "webhook://"
description: |
  `webhook://`: an HTTP endpoint described by OpenAPI 3.1; every accepted request is an
  item, shown as a row of the table. Send some from a terminal while the dashboard runs
  (it listens on `127.0.0.1:8765`).

  **Tokens.** Every endpoint but `/ping` needs a credential; any one of the three ways
  the document's `security` lists will do (`database.options.tokens` holds the accepted
  values):
  ```sh
  # a bearer token (either of the two in the list)
  curl -H "Authorization: Bearer demo-token" -d "user=cat&action=logout" \
       http://127.0.0.1:8765/hooks/forms
  # an API key header
  curl -H "X-API-Key: demo-key" -d "user=cat&action=logout" \
       http://127.0.0.1:8765/hooks/forms
  # Basic user:password
  curl -u demo:secret -d "user=cat&action=logout" http://127.0.0.1:8765/hooks/forms
  # no credential, or a wrong one: 401 with WWW-Authenticate
  curl -i -d "user=cat&action=logout" http://127.0.0.1:8765/hooks/forms
  ```
  Keep a real token out of the file: `tokens: { bearer: "${EVENTS_TOKEN}" }` reads it
  from the environment (start Neovim with `EVENTS_TOKEN=...`), and senders use
  `-H "Authorization: Bearer $EVENTS_TOKEN"`. Tokens are compared in constant time and
  never shown in `request`, errors or replies.

  The requests below use the bearer token:

  **Events**, one JSON object per line (`application/x-ndjson`), each checked against
  the Event schema; the path picks the source (`web` or `app`):
  ```sh
  curl -H "Authorization: Bearer demo-token" \
       -H "Content-Type: application/x-ndjson" \
       -H "X-Request-Id: r1" --cookie "region=eu" \
       --data-binary $'{"user": "ann", "action": "login"}\n{"user": "bob", "action": "purchase", "amount": 9.5}\n' \
       http://127.0.0.1:8765/hooks/events/web
  ```

  **A form** (urlencoded or multipart) is one item:
  ```sh
  curl -H "Authorization: Bearer demo-token" \
       -d "user=cat&action=logout" http://127.0.0.1:8765/hooks/forms
  curl -H "Authorization: Bearer demo-token" \
       -F user=dan -F action=login http://127.0.0.1:8765/hooks/forms
  ```

  **Log lines** (`text/x-log`): one item per line:
  ```sh
  curl -H "Authorization: Bearer demo-token" -H "Content-Type: text/x-log" \
       --data-binary $'eve login\nfay logout\n' http://127.0.0.1:8765/hooks/logs
  ```

  **A ping** needs no token and no body: the query parameters are the item, and the
  reply is the documented example:
  ```sh
  curl "http://127.0.0.1:8765/hooks/ping?n=3&tags=a,b"
  ```

  A request the document does not allow is rejected with `application/problem+json`:
  401 without a valid credential, 400 for an invalid event (try `"action": 1`), 403 for
  an `Origin` other than `http://localhost:3000`. See `:help dbdash-webhook` and
  `:help dbdash-webhook-security`.

database:
  url: "webhook://127.0.0.1:8765/hooks"
  options:
    tokens:                       # the accepted credentials, by security scheme name
      bearer: ["demo-token", "demo-token-2"]   # a list: either is accepted (rotation)
      apikey: "demo-key"
      basic: "demo:secret"                       # user:password
    delimiter: "\n"
    stream_types: ["text/x-log"]
    max_body: "1MB"
    max_connections: 8
    timeout: 5s
    allowed_origins: ["http://localhost:3000"]   # a local web app may post from a browser
    allowed_hosts: ["dashboard.local"]

query:
  sql: |
    openapi: 3.1.0
    info: { title: events, version: "1" }
    # any one of these: a bearer token, an API key header, Basic user:password
    security: [ { bearer: [] }, { apikey: [] }, { basic: [] } ]
    paths:
      /events/{source}:
        post:
          operationId: events
          parameters:
            - { name: source, in: path, required: true, schema: { type: string, enum: [web, app] } }
            - { name: X-Request-Id, in: header, schema: { type: string } }
            - { name: region, in: cookie, schema: { type: string, default: "us" } }
          requestBody:
            required: true
            content:
              application/x-ndjson:
                schema: { $ref: "openapi/events.schema.yaml#/Event" }
          responses: { "202": { description: queued } }
      /ping:
        get:
          operationId: ping
          security: []
          parameters:
            - { name: n, in: query, schema: { type: integer, minimum: 0, default: 1 } }
            - { name: tags, in: query, style: form, explode: false, schema: { type: array, items: { type: string } } }
          responses:
            "200":
              description: pong
              content: { application/json: { example: { pong: true } } }
      /forms:
        post:
          operationId: forms
          requestBody:
            content:
              application/x-www-form-urlencoded: { schema: { $ref: "openapi/events.schema.yaml#/Event" } }
              multipart/form-data: { schema: { $ref: "openapi/events.schema.yaml#/Event" } }
          responses: { "202": { description: queued } }
      /logs:
        post:
          operationId: logs
          requestBody:
            content:
              text/x-log: { schema: { type: string, pattern: "^\\w+ \\w+$" } }
          responses: { "202": { description: queued } }
    components:
      securitySchemes:
        bearer: { type: http, scheme: bearer }               # Authorization: Bearer <token>
        apikey: { type: apiKey, in: header, name: X-API-Key } # X-API-Key: <key>
        basic: { type: http, scheme: basic }                 # Authorization: Basic (curl -u)
  transform: |
    -- rs: one item; params: { path, query, header, cookie }; request: method, path,
    -- operation_id, content_type, headers (without credentials).
    store.events = store.events or {}
    local what
    if request.operation_id == "ping" then
      what = ("ping n=%d tags=%s"):format(rs.n, table.concat(rs.tags or {}, "+"))
    elseif request.operation_id == "logs" then
      what = rs
    else
      what = ("%s %s%s"):format(rs.user, rs.action, rs.amount and (" " .. rs.amount) or "")
    end
    local from = params.path.source or request.operation_id
    local region = params.cookie.region or ""
    table.insert(store.events, 1, { os.date("%H:%M:%S"), from, region, what })
    while #store.events > 12 do table.remove(store.events) end
    return { columns = { "at", "from", "region", "event" }, rows = store.events }

show:
  type: table
  title: "Events pushed over HTTP"
  description: |
    The events posted to the endpoints, the newest first: when, which endpoint or
    source, the region cookie, and the event. Press `K` on the header line for curl
    commands that send some.
  interval: 1s
