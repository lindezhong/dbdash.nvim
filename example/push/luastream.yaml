# yaml-language-server: $schema=../dbdash.schema.yaml
#
# luastream:// - Lua whose output is the data (:help dbdash-luastream, dbdash-push).
# - print() / io.write() text is cut into items at database.options.delimiter (a newline by
#   default); dbdash.emit(value) passes one item as it is (a table here).
# - Each item goes through query.transform one at a time (rs is the item); the panel shows
#   new data at most once per show.interval (the first item of a period at once, the
#   latest of the others at the next tick). When the code returns, the panel ends.
# - Items wait in a queue while query.transform is busy: setup push.max_queue (unlimited
#   by default) keeps only the newest when set.
# - database.options.cwd is the code's directory for files and commands.
# - dbdash.run(args) in query.transform takes the same item again with other arguments
#   (meta.run.kind is "callback" there); nothing is shown or recorded for it.
# It runs Lua, so dbdash asks whether you trust this file first.

title: "luastream://"
description: |
  `luastream://`: Lua code whose `print()` / `io.write()` output (or `dbdash.emit()`) is
  the data, item by item. Runs Lua, so it asks for trust first. See
  `:help dbdash-luastream`.

style:
  dashboard: { grid-template-columns: 2 }
  panel: { border: single, padding: [0, 1] }

panels:
  - database: { url: "luastream://" }
    query:
      sql: |
        -- One reading per second for a minute, as JSON lines.
        for i = 1, 60 do
          print(vim.json.encode({ at = os.date("%H:%M:%S"), load = 40 + math.random(0, 30) }))
          dbdash.sleep(1000)
        end
      transform: |
        -- Each item is one line; keep the last 30 readings in store to draw them.
        store.points = store.points or {}
        table.insert(store.points, vim.json.decode(rs))
        while #store.points > 30 do table.remove(store.points, 1) end
        return store.points
    show:
      type: line
      title: "print(): one reading per second"
      description: |
        One JSON row printed per second; the panel shows new data at most once per
        `interval`.
      x_column: at
      y_column: load
      interval: 2s

  - database:
      url: "luastream://"
      options:
        cwd: "openapi"          # files and commands of the code are here
        delimiter: ";"          # io.write("a;b;") gives two items
    query:
      sql: |
        -- Count the lines of a file in cwd, written as items separated by ";".
        local n = 0
        for _ in io.lines("events.schema.yaml") do n = n + 1 end
        io.write("lines=" .. n .. ";")
        io.write("dir=" .. dbdash.cwd .. ";")
        -- dbdash.emit: one item as it is, no cutting (the last item: the code ends).
        dbdash.emit({ { key = "done", value = os.date("%H:%M:%S") } })
      transform: |
        store.rows = store.rows or {}
        if type(rs) == "string" then
          local k, v = rs:match("^(%w+)=(.*)$")
          table.insert(store.rows, { key = k, value = v })
        else
          vim.list_extend(store.rows, rs) -- the emitted table
        end
        return { columns = { "key", "value" }, rows = vim.tbl_map(function(r)
          return { r.key, r.value }
        end, store.rows) }
    show:
      type: table
      title: "io.write() with a delimiter, dbdash.emit(), cwd"
      description: |
        `io.write()` with `delimiter: ";"`, `dbdash.emit()` for a value as it is, and `cwd`
        for `dbdash.cwd()`.
      interval: 1s

  - database: { url: "luastream://" }
    query:
      args:
        - name: unit
          type: string
          default: C
          choices: [C, F]
          description: "Unit of the reading"
      sql: |
        -- A temperature every 2 seconds, in Celsius.
        for i = 1, 600 do
          print(vim.json.encode({ celsius = 15 + math.random(0, 100) / 10 }))
          dbdash.sleep(2000)
        end
      transform: |
        local c = vim.json.decode(rs).celsius
        local value = args.unit == "F" and c * 9 / 5 + 32 or c
        if meta.run.kind == "callback" then
          return { { value = value } }                  -- for the caller below
        end
        -- the same item again, in the other unit
        local other = args.unit == "F" and "C" or "F"
        local again = dbdash.run({ unit = other }).rows[1][1]
        return { columns = { "reading", "other unit" },
                 rows = { { ("%.1f °%s"):format(value, args.unit),
                            ("%.1f °%s"):format(again, other) } } }
    show:
      type: table
      title: "dbdash.run(): the same item in the other unit"
      description: |
        `dbdash.run({ unit = ... })` in `query.transform` takes the current item again with
        another argument. Change the unit with `:DbDashUpdateVariable unit F`.
      args_show: true
      interval: 2s
