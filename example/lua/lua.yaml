# yaml-language-server: $schema=../dbdash.schema.yaml
#
# lua:// - the query is Lua code that returns rows. It sees the arguments as `args` and
# helpers such as dbdash.system() (run a command without blocking the editor) and
# dbdash.query() (query another database). dbdash asks whether you trust this file before
# running it (once, and again after changes); see :help dbdash-lua.
#
# Like SQL, the code goes through the template first ({{ }}, {% %}, :help dbdash-templates);
# values are inserted as written. Reading them from `args` inside Lua needs no quoting.
# Try: :DbDashStart lua.yaml days=30 wave=false

title: "Lua source"
description: |
  A `lua://` source: Lua code returns the rows; it sees the arguments, the template and
  the `dbdash.*` helpers. Runs Lua, so it asks for trust first. See `:help dbdash-lua`.

database:
  url: "lua://"

query:
  args:
    - name: days
      type: int
      default: 14
    - name: base
      type: number
      default: 50
    - name: wave
      type: boolean
      default: true
      description: "Add a sine wave to the load"
  sql: |
    -- A command's output: here just the host name.
    local host = vim.trim(dbdash.system("hostname").stdout)

    -- Data computed in Lua; dbdash.query() could read it from a database instead.
    local rows = {}
    for i = {{ args.days }} - 1, 0, -1 do            -- template: the value is written into the code
      local t = os.time() - i * 86400
      local load = args.base                    -- args: the value as a Lua number
    {% if args.wave %}
      load = load + math.floor(30 * math.sin(i / 2))
    {% endif %}
      rows[#rows + 1] = { os.date("%m-%d", t), load, host, i == 0 and dbdash.null or i }
      dbdash.checkpoint()                       -- let the editor run during long loops
    end
    -- dbdash.null is NULL inside a row (nil would end a Lua list early).
    return { columns = { "day", "load", "host", "days_ago" }, rows = rows }

show:
  args_show: true
  type: line
  title: "Lua data source"
  description: |
    `{{ args.days }}` days of load computed in Lua (`args.base`, a sine wave when
    `args.wave`), the host name from `dbdash.system()`; `dbdash.null` is NULL inside a row
    and `dbdash.checkpoint()` lets the editor run during long loops.
  x_column: day
  y_column: load
  interval: 60s
