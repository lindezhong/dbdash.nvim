# yaml-language-server: $schema=../dbdash.schema.yaml
#
# SQL in templates (:help dbdash-template-filters, dbdash-template-autoescape,
# dbdash-template-dialects): filters and functions that write SQL for the panel's
# database (SQLite here; the files in ../databases/ use them on the others), and
# query.autoescape, which writes every {{ value }} as a literal (a {% lua %} block's
# result too, unless it returns dbdash.safe(...)). It runs Lua, so dbdash asks whether you
# trust this file first.

title: "SQL filters, functions and autoescape"
description: |
  SQL in templates: filters and functions that write SQL for the panel's database, and
  `query.autoescape`. See `:help dbdash-template-filters`.

database:
  url: "sqlite:///:memory:"

args:
  - name: name
    default: "O'Neil"
  - name: depts
    type: list
    default: [IT, HR]
  - name: limit
    type: int
    default: 5
  - name: column
    default: "users.name"

show:
  interval: 1h

layout:
  columns: 1

panels:
  - query:
      sql: |
        {% from 'parts/show.sql' import rows %}
        {% set r = [] %}
        {% set c %}{% raw %}{{ args.name | sql_quote }}{% endraw %}{% endset %}{% set o %}{{ args.name | sql_quote }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ args.name | sql_escape }}{% endraw %}{% endset %}{% set o %}{{ args.name | sql_escape }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ args.depts | sql_in }} {{ [] | sql_in }}{% endraw %}{% endset %}{% set o %}{{ args.depts | sql_in }} {{ [] | sql_in }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ args.column | sql_id }}{% endraw %}{% endset %}{% set o %}{{ args.column | sql_id }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}LIMIT {{ args.limit | sql_limit }}|{{ none | sql_limit }}{% endraw %}{% endset %}{% set o %}LIMIT {{ args.limit | sql_limit }}|{{ none | sql_limit }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ none | sql_quote }} {{ true | sql_quote }} {{ 2.5 | sql_quote }}{% endraw %}{% endset %}{% set o %}{{ none | sql_quote }} {{ true | sql_quote }} {{ 2.5 | sql_quote }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ sql_case({'n > 10': "'big'", 'n > 0': "'small'"}, "'none'") }}{% endraw %}{% endset %}{% set o %}{{ sql_case({'n > 10': "'big'", 'n > 0': "'small'"}, "'none'") }}{% endset %}{% do r.append([c, o]) %}
        {% set c %}{% raw %}{{ sql_concat('id-', 42) }}{% endraw %}{% endset %}{% set o %}{{ sql_concat('id-', 42) }}{% endset %}{% do r.append([c, o]) %}
        {{ rows(r) }}
    show:
      type: table
      title: "SQL filters and functions (the SQL they write)"
      description: |
        The filters and functions that write SQL for the panel's database (SQLite here):
        literals (`sql_quote`, `sql_escape`), lists (`sql_in`), identifiers (`sql_id`),
        LIMIT values (`sql_limit`), `sql_case()` and `sql_concat()`. Each row is a
        template as written and the SQL it gave.
      column_list:
        - { column: template, alias: "template (as written)" }
        - { column: result, alias: "result" }
  - query:
      autoescape: true
      sql: |
        -- query.autoescape: every value written with {% raw %}{{ }}{% endraw %} is a literal of the database; SQL from
        -- the filters, | safe, macros and dbdash.safe() is not escaped again.
        WITH t(name) AS (VALUES ('O''Neil'))
        SELECT {{ args.name }} AS arg,
               {{ args.depts | length }} AS depts,
               {{ 'name' | safe }} = {{ args.name }} AS same,
               {% autoescape false %}'{{ args.limit }}'{% endautoescape %} AS autoescape_off,
               {% lua %}return dbdash.safe("upper(name)"){% endlua %} AS from_lua
        FROM t
    show:
      type: table
      title: "query.autoescape: true"
      description: |
        With `query.autoescape: true` every {% raw %}`{{ value }}`{% endraw %} is a literal; filters, `| safe`,
        macros and `dbdash.safe()` are not escaped again, and {% raw %}`{% autoescape false %}`{% endraw %} turns it
        off for a part.

  - query:
      sql: |
        -- Without autoescape: values are inserted as written; quote them with the filters.
        WITH users(name, dept) AS (VALUES ('O''Neil', 'IT'), ('ann', 'HR'), ('bob', 'Ops'))
        SELECT name, dept FROM users
        WHERE dept IN {{ args.depts | sql_in }} OR name = {{ args.name | sql_quote }}
        ORDER BY {{ 'name' | sql_id }}
        LIMIT {{ args.limit | sql_limit }}
    show:
      type: table
      title: "a query with the filters"
      description: |
        Without autoescape values go in as written: quote them with `sql_in`, `sql_quote`,
        `sql_id` and `sql_limit`.
