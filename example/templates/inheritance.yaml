# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Jinja2 templates beyond macros (:help dbdash-templates):
# - {% extends %} / {% block %}: parts/report.sql lays out the query, the first panel
#   fills its blocks; {{ super() }} keeps the base's own columns.
# - {% include %}: parts/filters.sql is a shared WHERE fragment; it sees args and the
#   including template's variables.
# - {% call %} wraps text in a macro (caller()), namespace() keeps a count across a loop,
#   {% set x %}...{% endset %} captures output, {% for ... if ... %} filters a loop, and
#   filters such as sort, map, join and groupby work on lists.
# - "+%}" keeps the line break after a tag, which trim_blocks would remove (an included
#   file's output does not end with one).

title: "Jinja2 templates"

database:
  url: "sqlite:///:memory:"

args:
  - name: teams
    type: list
    default: [red, blue, green]
  - name: min_score
    type: int
    default: 20

layout:
  columns: 2

panels:
  - query:
      sql: |
        {% extends 'parts/report.sql' %}
        {% set min_score = args.min_score %}
        {% block columns %}team, count(*) AS players, {{ super() }}{% endblock %}
        {% block where %}{% include 'parts/filters.sql' %}{% endblock %}
        {% block rest %}GROUP BY team ORDER BY team{% endblock %}
    show:
      type: table
      title: "extends, block, include"

  - query:
      sql: |
        {% import 'parts/helpers.sql' as h %}
        {% set ns = namespace(counted=[]) %}
        {% set columns %}
        {% for team in args.teams | sort if team != 'green' %}
          {% do ns.counted.append(team) %}
          {{ h.count_if('team', team) }} AS {{ team }},
        {% endfor %}
        {% endset %}
        {% include 'parts/players.sql' +%}
        SELECT {{ columns }}
               {% call h.column('all_players') %}count(*){% endcall %},
               {{ ns.counted | map('upper') | join('/') | sql_quote }} AS counted,
               {{ '%d team(s)' | format(ns.counted | length) | sql_quote }} AS teams
        FROM players
    show:
      type: table
      title: "call, namespace, set block, filters"

  - query:
      sql: |
        {% set ranks = [{'name': 'gold', 'min': 80}, {'name': 'silver', 'min': 50},
                        {'name': 'bronze', 'min': 0}] %}
        {% include 'parts/players.sql' +%}
        SELECT CASE
          {% for r in ranks | sort(attribute='min', reverse=true) %}
          WHEN score >= {{ r.min }} THEN {{ r.name | title | sql_quote }}
          {% endfor %}
          END AS rank, count(*) AS players
        FROM players
        GROUP BY rank
        ORDER BY min(score) DESC
    show:
      type: bar
      title: "Players per rank (a loop over sorted mappings)"
      x_column: rank
      y_column: players
      span: 2

  - query:
      sql: |
        {# A child two levels down: page.sql <- section.sql <- this. #}
        {% extends 'parts/section.sql' %}
        {% block line %}{{ super() }} (child, n={{ n }}){% endblock %}
    show:
      type: table
      title: "extends (two levels), super(), self.title(), scoped, required"

  - query:
      sql: |
        {% from 'parts/show.sql' import show %}
        {% set who = 'ann' %}
        {% import 'parts/consts.sql' as c %}
        {% import 'parts/consts.sql' as cc with context %}
        {% from 'parts/consts.sql' import version, greet without context %}
        {{ show("import: top-level variables (c.version, c._private)", c.version ~ ' ' ~ (c._private is defined)) }}
        UNION ALL {{ show("macro without / with context", c.greet() ~ ' / ' ~ cc.greet()) }}
        UNION ALL {{ show("from ... import version, greet", version ~ ' ' ~ greet()) }}
        {% set out %}{% include 'parts/greeting.sql' %}{% endset %}
        UNION ALL {{ show("include (with context, the default)", out | trim) }}
        {% set out %}{% include 'parts/greeting.sql' without context %}{% endset %}
        UNION ALL {{ show("include ... without context", out | trim) }}
        {% set out %}{% include 'parts/missing.sql' ignore missing %}{% endset %}
        UNION ALL {{ show("include ... ignore missing", '[' ~ out ~ ']') }}
        {% set out %}{% include ['parts/missing.sql', 'parts/greeting.sql'] %}{% endset %}
        UNION ALL {{ show("include [list]: the first that exists", out | trim) }}
    show:
      type: table
      title: "import and include: context, exports, missing files"

