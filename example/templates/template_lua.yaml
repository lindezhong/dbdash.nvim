# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Lua in templates, the same in query.sql and query.transform:
# - {% import 'modules/helpers.lua' as h %} imports a Lua module (a file returning a table);
#   {{ h.since(args.days) }} calls one of its functions. The module's functions see args
#   and meta too: h.recent('day') and h.label('visits') use what is passed, args.days and
#   meta.
# - {% lua %} ... {% endlua %} runs Lua where it stands and outputs what it returns; it
#   sees args, meta, vars (the template variables visible there) and dbdash.*.
# - args.<name> are the arguments, meta.<name> the metadata (:help dbdash-meta).
# The config and modules/helpers.lua are trusted together, once (:help dbdash-lua).
# Try: :DbDashStart template_lua.yaml days=14

title: "Lua in templates"
description: |
  Lua in templates: {% raw %}`{% lua %}`{% endraw %} blocks and imported `.lua` modules in `query.sql` and
  `query.transform`. Runs Lua, so it asks for trust first. See
  `:help dbdash-template-lua`.

database:
  url: "sqlite:///:memory:"

query:
  args:
    - name: days
      type: int
      default: 7
  sql: |
    {% import 'modules/helpers.lua' as h %}
    WITH data(day, visits) AS (VALUES {{ h.sample_values(args.days) }})
    SELECT day, visits,
           {% lua %}
             -- weekend flag computed by SQLite, written by Lua
             return "strftime('%w', day) IN ('0', '6')"
           {% endlua %} AS weekend
    FROM data
    WHERE {{ h.recent('day') }}
  transform: |
    {% import 'modules/helpers.lua' as h %}
    -- Lua: mark weekends and add a running total; the source column comes from the same
    -- helper module, rendered into this code by the template.
    local source, out, total = "{{ h.label('visits') }}", {}, 0
    for _, r in ipairs(rs.rows) do
      total = total + r[2]
      out[#out + 1] = { day = r[1]:sub(6), visits = r[2], total = total,
                        note = r[3] == 1 and "weekend" or "", source = source }
    end
    out.columns = { "day", "visits", "total", "note", "source" }
    return out

show:
  args_show: true
  type: table
  title: "Visits (Lua in templates)"
  description: |
    Rows made by a Lua module (`modules/helpers.lua`), a column written by a {% raw %}`{% lua %}`{% endraw %}
    block, and a transform that adds a running total.
