# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Bubble chart: every canvas and option, one panel each (press K on a panel). A scatter
# plot whose point size follows size_column, colored by color_column and labeled by
# label_column.

title: "Bubble chart"
description: |
  A bubble chart is a scatter plot with sizes: (`x_column`, `y_column`) per row, the
  circle's area by `size_column`, groups by `color_column`, a text by `label_column`.
  See `:help dbdash-chart-types`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "size, color and label columns (canvas: braille)"
      description: |
        `size_column` sets each circle's area, `color_column` groups the bubbles (colored by
        `series.<group>` rules), `label_column` writes a text next to each.
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
      label_column: company
      axes:
        x_axis: { title: "Revenue" }
        y_axis: { title: "Margin %" }
    style:
      "series.Large": { color: "#61afef" }
      "series.Mid": { color: "#98c379" }
      "series.Small": { color: "#e5c07b" }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "size_range, trend_line, point { content }"
      description: |
        `size_range: [min, max]` is the smallest and largest radius in canvas pixels (Chart.js
        `radius`); `trend_line: linear` fits a dashed line through the centers; the style
        rule `point { content: "+" }` marks each center with a character.
      x_column: revenue
      y_column: margin
      size_column: cap
      size_range: [2, 10]
      trend_line: linear
    style:
      point: { content: "+" }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "chart { canvas: quadrant }"
      description: "`chart { canvas: quadrant }`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
    style:
      chart: { canvas: quadrant }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "chart { canvas: block }"
      description: "`chart { canvas: block }`: one full block per pixel: coarse but bold."
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
    style:
      chart: { canvas: block }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "chart { canvas: halfblock }"
      description: "`chart { canvas: halfblock }`: 1 x 2 pixels per character (▀ ▄)."
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
    style:
      chart: { canvas: halfblock }
  - query:
      sql: |
        SELECT company, revenue, margin, cap,
               CASE WHEN cap > 800 THEN 'Large' WHEN cap > 400 THEN 'Mid' ELSE 'Small' END AS class
        FROM (
          SELECT 'Apple' AS company, 80 AS revenue, 25 AS margin, 1400 AS cap
          UNION ALL SELECT 'Google', 70, 22, 1100 UNION ALL SELECT 'Tesla', 30, 35, 600
          UNION ALL SELECT 'Netflix', 20, 15, 250 UNION ALL SELECT 'Adobe', 25, 40, 300
          UNION ALL SELECT 'Meta', 50, 30, 700
        )
    show:
      type: bubble
      title: "chart { canvas: ascii }"
      description: "`chart { canvas: ascii }`: plain ASCII, for any terminal or font."
      x_column: revenue
      y_column: margin
      size_column: cap
      color_column: class
    style:
      chart: { canvas: ascii }
