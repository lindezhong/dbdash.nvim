# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Text: every option, one panel each (press K on a panel). The rows as plain text, like a
# log viewer: separators, wrapping, alignment, line numbers, colored matches, newest
# first, and a line limit.

title: "Text"
description: |
  A text chart shows the result without a table: each row is its cells joined by
  `separator`; newlines in a cell start new lines and long lines wrap. Good for
  logs, messages and `lua://` output. See `:help dbdash-chart-types`.

database:
  url: "sqlite3:///:memory:"        # sqlite3:// is the same as sqlite://

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 12)
        SELECT strftime('%H:%M:%S', 'now', '-' || (12 - i) || ' minutes') AS at,
               CASE WHEN i % 5 = 0 THEN 'ERROR' WHEN i % 3 = 0 THEN 'WARN ' ELSE 'INFO ' END AS level,
               'request ' || i || ' served in ' || (i * 37 % 200) || ' ms' AS message
        FROM n
    show:
      type: text
      title: "separator, column_list"
      description: |
        `column_list` picks and orders the columns, `separator` joins them (default a space).
      column_list: [at, level, message]
      separator: " │ "
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 12)
        SELECT strftime('%H:%M:%S', 'now', '-' || (12 - i) || ' minutes') AS at,
               CASE WHEN i % 5 = 0 THEN 'ERROR' WHEN i % 3 = 0 THEN 'WARN ' ELSE 'INFO ' END AS level,
               'request ' || i || ' served in ' || (i * 37 % 200) || ' ms' AS message
        FROM n
    show:
      type: text
      title: "highlight, reverse, line numbers"
      description: |
        `highlight` gives the lines that match a Vim regex a class (the first rule wins),
        colored by `line.<class>` rules; `reverse` puts the last row first (newest on top),
        `line-number { display: block }` numbers the rows.
      reverse: true
      highlight: [{ pattern: ERROR, class: error }, { pattern: WARN, class: warn }]
    style:
      line-number: { display: block }
      line.error: { color: "#e06c75" }
      line.warn: { color: "#e5c07b" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 12)
        SELECT strftime('%H:%M:%S', 'now', '-' || (12 - i) || ' minutes') AS at,
               CASE WHEN i % 5 = 0 THEN 'ERROR' WHEN i % 3 = 0 THEN 'WARN ' ELSE 'INFO ' END AS level,
               'request ' || i || ' served in ' || (i * 37 % 200) || ' ms' AS message
        FROM n
    show:
      type: text
      title: "chart { line-clamp }, line { color }"
      description: |
        `chart { line-clamp: 5 }` shows the first 5 lines and how many more there are;
        `line { color }` colors the text.
    style:
      chart: { line-clamp: 5 }
      line: { color: "#98c379" }
  - query:
      sql: |
        SELECT 'A long message that does not fit on one line of the panel wraps at the spaces, as text does in a browser.' AS t
        UNION ALL SELECT 'first line' || char(10) || 'second line of the same cell'
    show:
      type: text
      title: "wrap (default), newlines"
      description: |
        Long lines wrap at spaces (`line { white-space: normal }`, the default;
        `word-break: break-all` breaks anywhere); newlines in a cell start new lines.
  - query:
      sql: |
        SELECT 'A long message that does not fit on one line of the panel is cut at the edge, wherever that edge happens to be in your window.' AS t
    show:
      type: text
      title: "white-space: nowrap, text-overflow"
      description: |
        `line { white-space: nowrap }` keeps one line per row and cuts it at the edge
        (`text-overflow: "…"` marks the cut; the default `clip` does not).
    style:
      line: { white-space: nowrap, text-overflow: "…" }
  - query:
      sql: |
        SELECT 'centered' AS t UNION ALL SELECT 'text' UNION ALL SELECT NULL
    show:
      type: text
      title: "line { text-align: center }, cell.null"
      description: |
        `line { text-align }` aligns the lines (left, center, right); `cell.null { content }`
        is what a NULL shows (default nothing).
    style:
      line: { text-align: center }
      "cell.null": { content: "(none)" }
