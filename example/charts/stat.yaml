# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Stat ("KPI"): every option, one panel each (press K on a panel). After Grafana's stat
# panel: how the value is picked from the rows, its format, prefix and unit, thresholds,
# the change and sparkline, color mode, size, and several values side by side. Leave it
# open for a few refreshes to see the change and the sparkline. Thresholds give the value
# a class (success, info, warning, danger are colored by default); style rules do the rest.

title: "Stat"
description: |
  A stat shows one value in large digits, its change since the previous refresh and a
  sparkline of the last refreshes. The value is the first row of `value_column` (default:
  the first numeric column), or `reduce` of all rows. See `:help dbdash-chart-types`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5s

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        SELECT 900 + abs(random() % 300) AS users
    show:
      type: stat
      title: "format, unit, thresholds (notify)"
      description: |
        `format` is a Python format ("{:,}"), `unit` follows the value. `thresholds` give the
        value a class (>= 1000 `warning`, >= 1190 `danger`), which the default style sheet
        colors; a step with `notify: true` also notifies once when the value rises to it.
      value_column: users
      format: "{:,}"
      unit: users
      thresholds:
        - { value: 1000, class: warning }
        - { value: 1190, notify: true, class: danger }
  - query:
      sql: |
        SELECT abs(random() % 100) AS free_pct
    show:
      type: stat
      title: "thresholds_below, delta_mode: absolute"
      description: |
        `thresholds_below: true`: lower is worse (free space under 30 yellow, under 10 red).
        `delta_mode: absolute` shows the change as an amount, not a percentage.
      format: "{:.0f}%"
      thresholds_below: true
      thresholds:
        - { value: 30, class: warning }
        - { value: 10, class: danger }
      delta_mode: absolute
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 10)
        SELECT 100 + abs(random() % 50) AS amount FROM n
    show:
      type: stat
      title: "reduce: sum, prefix, label"
      description: |
        `reduce: sum` adds up all rows (also `first`, `last`, `mean`, `min`, `max`, `count`;
        Grafana `reduceOptions.calcs`); `prefix` comes before the value, `label` is a muted
        line under it.
      value_column: amount
      reduce: sum
      prefix: "$"
      label: "revenue, last 10 orders"
  - query:
      sql: |
        SELECT abs(random() % 500) AS queue
    show:
      type: stat
      title: "background color by class, sparkline_length"
      description: |
        Grafana's `colorMode: background` is a style rule: `value.success { background-color }`
        puts the threshold's color behind the value. `sparkline_length: 40` keeps the last 40
        refreshes.
      sparkline_length: 40
      thresholds:
        - { value: 0, class: success }
        - { value: 400, class: danger }
    style:
      value.success: { background-color: DiagnosticOk, color: "#282c34" }
      value.danger: { background-color: DiagnosticError, color: "#282c34" }
  - query:
      sql: |
        SELECT abs(random() % 10000) / 100.0 AS latency
    show:
      type: stat
      title: "value { font-size: normal }, no delta and sparkline"
      description: |
        `value { font-size: normal }` writes the value on one line instead of block digits;
        `delta` and `sparkline { display: none }` hide the second line.
      format: "{:.2f} ms"
    style:
      value: { font-size: normal }
      delta: { display: none }
      sparkline: { display: none }
  - query:
      sql: |
        SELECT 1200 + abs(random() % 300) AS orders, abs(random() % 100) / 100.0 AS conversion,
               40 + abs(random() % 20) AS refunds
    show:
      type: stat
      title: "value_columns: several values"
      description: |
        `value_columns` shows several values side by side (a Grafana stat with several fields),
        each a column name or `{ column, label, format, unit, prefix }`. The change and
        sparkline follow the first value.
      value_columns:
        - orders
        - { column: conversion, label: "conversion", format: "{:.0%}" }
        - { column: refunds, label: "refunds", prefix: "-" }
    style:
      panel: { grid-column: span 2 }
