# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Style sheets (:help dbdash-css): all appearance is CSS rules, selector -> properties.
# One panel per idea, the same data each time; press K on a panel for the rules it shows.
# Colors are "#3498db", a name ("blue") or a highlight group ("DiagnosticOk").
#
# The cascade, lowest first: the default sheet < setup({ style }) < this file's `style`
# < a panel's `style` (only matches inside that panel) < :DbDashStyle; within one sheet
# the more specific selector wins, then the later rule.

title: "Style sheets (CSS)"
description: |
  Every element of a dashboard can be styled: the header, panels and their titles, a
  chart and its parts (title, plot, axis, label, legend, series, value, ...), table rows
  and cells. The top-level `style` applies to every panel, a panel's `style` to its own
  elements only. Try `:DbDashStyle set value color DiagnosticOk`. See `:help dbdash-css`.

database:
  url: "sqlite:///:memory:"

interval: 10m

style:
  dashboard: { grid-template-columns: 3 }
  # every panel title in this dashboard, then one panel by its id
  panel-title: { font-weight: bold }
  "#highlighted panel-title": { color: "#e5c07b" }

panels:
  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "series, value, label colors"
      description: |
        A chart's parts are elements: `series { color }` colors the data, `value` the
        numbers, `label` the categories.
      x_column: region
      y_column: sales
    style:
      series: { color: "#e5c07b" }
      value: { color: "#98c379" }
      label: { color: "#c678dd", font-style: italic }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "panel { background-color, padding }"
      description: |
        The panel's box: `background-color`, and `padding` like CSS (`[1, 2]`: one line
        above and below, two columns left and right).
      x_column: region
      y_column: sales
    style:
      panel: { background-color: "#1e2030", padding: [1, 2] }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "panel { border, border-color }"
      description: |
        A box around the panel (`border`: single, rounded, heavy, double, dashed or ascii)
        with the title in its top line, like a fieldset; `border-color` colors it.
      x_column: region
      y_column: sales
    style:
      panel: { border: rounded, border-color: "#61afef" }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: line
      title: "plot { border: double }, axis { color }"
      description: |
        The plot's own frame (`plot { border }`: single, rounded, heavy, double, dashed,
        ascii or none) and the tick labels' color (`axis { color }`).
      x_column: region
      y_column: sales
    style:
      plot: { border: double, border-color: "#5c6370" }
      axis: { color: "#56b6c2" }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: line
      title: "axis { display: none }, plot { border: none }"
      description: |
        `display: none` takes an element out: `axis` hides the tick labels and axis titles,
        `plot { border: none }` the frame.
      x_column: region
      y_column: sales
    style:
      axis: { display: none }
      plot: { border: none }

  - id: highlighted
    query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: pie
      title: "#highlighted: legend, title"
      description: |
        This panel's id is `highlighted`: the top-level rule `"#highlighted panel-title"`
        colors its title. Its own `legend { color }` colors the legend labels, and
        `panel-title { text-decoration: underline }` adds to the cascade.
      label_column: region
      value_column: sales
    style:
      legend: { color: "#abb2bf" }
      panel-title: { text-decoration: underline }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: stat
      title: "justify-self / align-self: center"
      description: |
        Where the chart sits in its cell: `justify-self` start, center, end or stretch;
        `align-self` start, center or end. `value { font-weight, color }` styles the digits.
      value_column: sales
    style:
      panel: { justify-self: center, align-self: center }
      value: { font-weight: bold, color: "#98c379" }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "panel-title { text-align: right }"
      description: "The title's position: `text-align` left, center or right."
      x_column: region
      y_column: sales
    style:
      panel-title: { text-align: right }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', 80 UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: bar
      title: "panel-title { display: none } (this title is hidden)"
      description: "`display: none` on the title; K still shows this description."
      x_column: region
      y_column: sales
    style:
      panel-title: { display: none }
      panel: { border: dashed }

  - query:
      sql: SELECT 'North' AS region, 120 AS sales UNION ALL SELECT 'South', NULL UNION ALL SELECT 'East', 95 UNION ALL SELECT 'West', 60
    show:
      type: table
      title: "table, cell, row:nth-child(even)"
      description: |
        A table with one line style (`table { border: rounded }`), no cell padding
        (`cell { padding: 0 }`, Bootstrap `.table-sm`), every other row shaded
        (`row:nth-child(even)`, Bootstrap `.table-striped`) and NULL in its own color
        (`cell.null`).
    style:
      table: { border: rounded }
      cell: { padding: 0 }
      "row:nth-child(even)": { background-color: "#2c313a" }
      header: { font-weight: bold }
      "cell.null": { color: "#e06c75", font-style: italic }

  - query:
      sql: SELECT 'a long text that wraps inside its column' AS text, 'top' AS a
    show:
      type: table
      title: "cell { vertical-align, height }"
      description: |
        Long cells wrap (`white-space: normal`); a short cell in a tall row sits by
        `vertical-align` (top, middle, bottom); `column_list[].align` aligns one column.
        `cell { height: 3 }` keeps at most three lines per cell; the rest ends with "…".
      column_list:
        - { column: text, width: 14 }
        - { column: a, align: center, width: 7 }
    style:
      cell: { vertical-align: middle, height: 3 }

  - query:
      sql: SELECT 'a long text that does not fit in one line' AS text
    show:
      type: table
      title: "cell { white-space: nowrap, text-overflow }"
      description: |
        `white-space: nowrap` keeps one line and cuts it with `text-overflow` ("…" by
        default, here "..."); `cell { width }` sets every column's width.
    style:
      cell: { white-space: nowrap, text-overflow: "...", width: 16 }
