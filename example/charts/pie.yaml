# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Pie chart: every renderer and option, one panel each (press K on a panel). After
# Chart.js pie / doughnut and ECharts pie: a bar or a circle, a donut, a half circle,
# sorting, the first N and "Other", colors, and what the legend shows.

title: "Pie chart"
description: |
  A pie chart shows each row's share: `label_column` names the slices, `value_column`
  sizes them (positive values only). The default style is one proportional bar with a
  legend; `renderer: circle` draws a round pie. See `:help dbdash-chart-types`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

layout:
  columns: 2

panels:
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "bar (default): colors by position"
      description: |
        One bar split in proportion, the legend under it with the value and the percentage.
        `colors` as a list colors the slices in order.
      label_column: dept
      value_column: budget
      colors: ["#e06c75", "#61afef", "#98c379", "#e5c07b", "#c678dd", "#56b6c2"]
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      renderer: circle
      title: "renderer: circle, palette: tableau"
      description: |
        A round pie on a braille canvas, the legend beside it (`legend.position: bottom` puts
        it under); `palette: tableau` instead of the colorscheme's colors.
      label_column: dept
      value_column: budget
      palette: tableau
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      renderer: circle
      title: "donut, format"
      description: |
        `donut: 0.6` leaves a hole of 60% of the radius (Chart.js `cutout`) and writes the
        total in it; `format` is the Python format of the values ("{:,} k").
      label_column: dept
      value_column: budget
      format: "{:,} k"
      style: { donut: 0.6 }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      renderer: circle
      title: "half, legend: bottom"
      description: |
        `half: true` draws the upper half (Chart.js `circumference: 180`, a gauge-like pie);
        the legend goes `bottom`.
      label_column: dept
      value_column: budget
      legend: { position: bottom }
      style: { half: true }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "sort, top, other_label"
      description: |
        `sort: desc` orders the slices by size, `top: 3` keeps the three largest and puts the
        rest in one slice named by `other_label` (default "Other").
      label_column: dept
      value_column: budget
      style: { sort: desc, top: 3, other_label: "Rest" }
  - query:
      sql: |
        SELECT 'Engineering' AS dept, 420 AS budget UNION ALL SELECT 'Sales', 310
        UNION ALL SELECT 'Marketing', 180 UNION ALL SELECT 'Research', 260
        UNION ALL SELECT 'Support', 90 UNION ALL SELECT 'HR', 40
    show:
      type: pie
      title: "colors by name, legend parts"
      description: |
        `colors` as a mapping colors slices by name; `show_labels`, `show_values` and
        `show_percentages` pick the legend's columns.
      label_column: dept
      value_column: budget
      colors: { Engineering: "#61afef", Sales: "#98c379" }
      style: { show_labels: true, show_values: false, show_percentages: true }
