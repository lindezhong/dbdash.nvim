# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Bar chart: sales per product category.
# Horizontal bars by default; try `renderer: vertical` or :DbDashStyle bar vertical.

database:
  url: "sqlite:///:memory:"

query:
  sql: |
    WITH categories AS (
      SELECT 'Electronics' AS category, abs(random() % 1000) + 500 AS sales
      UNION ALL SELECT 'Clothing', abs(random() % 800) + 300
      UNION ALL SELECT 'Books', abs(random() % 400) + 100
      UNION ALL SELECT 'Home', abs(random() % 600) + 200
      UNION ALL SELECT 'Sports', abs(random() % 500) + 150
      UNION ALL SELECT 'Food', abs(random() % 700) + 250
    )
    SELECT category, sales, sales * 1.2 AS target
    FROM categories
    ORDER BY sales DESC

show:
  type: bar
  title: "Sales by category"
  interval: 45s

  x_column: category                 # bar labels
  y_column: sales                    # bar lengths

  style:
    color: blue                      # bar color
    show_values: true                # value after each bar

  show_countdown: true
  countdown_format: "Next update: {time}s"
