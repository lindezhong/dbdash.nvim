# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Scatter plot: every canvas and option, one panel each (press K on a panel). Points by
# x_column / y_column, colored by color_column, with markers, a trend line, a log axis,
# grid lines and reference lines (Chart.js / ECharts options).

title: "Scatter plot"
description: |
  A scatter plot puts one point per row at (`x_column`, `y_column`); `color_column`
  splits the points into groups, colored by `series.<group>` rules. See
  `:help dbdash-charts`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "color_column, series colors, x_label / y_label (canvas: braille)"
      description: |
        `color_column` makes one group per value, colored by `series.<name>` rules (or
        `series:nth-child(N)` by position); `x_label` / `y_label` title the axes.
      x_column: ad_spend
      y_column: sales
      color_column: margin
      x_label: "Advertising"
      y_label: "Sales"
    style:
      "series.High": { color: "#98c379" }
      "series.Medium": { color: "#e5c07b" }
      "series.Low": { color: "#e06c75" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "trend_line: linear, point { content }"
      description: |
        `point { content: "●" }` draws each point as a character (Chart.js `pointStyle`);
        `trend_line: linear` adds a dashed least-squares line per group (ECharts regression).
      x_column: ad_spend
      y_column: sales
      trend_line: linear
    style:
      point: { content: "●" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "grid lines, axes ticks; mark_lines"
      description: |
        `grid.x` / `grid.y { display: block }` draw grid lines at the ticks (Chart.js
        `grid.display`), `axes.x_axis.ticks` asks for about that many ticks; `mark_lines`
        adds reference lines: the mean sales, and x = 50.
      x_column: ad_spend
      y_column: sales
      axes:
        x_axis: { ticks: 5 }
      mark_lines:
        - { value: mean }
        - { value: 50, axis: x, label: "budget" }
    style:
      "grid.x": { display: block }
      "grid.y": { display: block }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 30)
        -- spread over decades: a digit times a random power of ten (arithmetic only)
        SELECT (1 + abs(random() % 900) / 100.0)
                 * (CASE abs(random() % 4) WHEN 0 THEN 1 WHEN 1 THEN 10 WHEN 2 THEN 100 ELSE 1000 END)
                 AS size_kb,
               (1 + abs(random() % 900) / 100.0)
                 * (CASE abs(random() % 3) WHEN 0 THEN 1 WHEN 1 THEN 10 ELSE 100 END) AS ms
        FROM n
    show:
      type: scatter
      title: "axes: scale: log on both axes"
      description: |
        Log scales (Chart.js `type: logarithmic`) for values over several orders of magnitude:
        one tick per power of ten.
      x_column: size_kb
      y_column: ms
      axes:
        x_axis: { scale: log, title: "size (KB)" }
        y_axis: { scale: log, title: "time (ms)" }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "chart { canvas: quadrant }"
      description: "`chart { canvas: quadrant }`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      x_column: ad_spend
      y_column: sales
      color_column: margin
    style:
      chart: { canvas: quadrant }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "chart { canvas: block }"
      description: "`chart { canvas: block }`: one full block per pixel: coarse but bold."
      x_column: ad_spend
      y_column: sales
      color_column: margin
    style:
      chart: { canvas: block }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "chart { canvas: halfblock }"
      description: "`chart { canvas: halfblock }`: 1 x 2 pixels per character (▀ ▄)."
      x_column: ad_spend
      y_column: sales
      color_column: margin
    style:
      chart: { canvas: halfblock }
  - query:
      sql: |
        WITH RECURSIVE n(i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 40),
        d AS (SELECT 10 + (i * 37) % 90 AS ad_spend, i % 3 AS k FROM n)
        SELECT ad_spend, ad_spend * 2 + abs(random() % 60) AS sales,
               CASE k WHEN 0 THEN 'High' WHEN 1 THEN 'Medium' ELSE 'Low' END AS margin
        FROM d
    show:
      type: scatter
      title: "chart { canvas: ascii }"
      description: "`chart { canvas: ascii }`: plain ASCII, for any terminal or font."
      x_column: ad_spend
      y_column: sales
      color_column: margin
    style:
      chart: { canvas: ascii }
