# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Line chart: every renderer and option, one panel each (press K on a panel for what it
# shows). Options follow Chart.js and ECharts: series (y_columns, series_column), gaps,
# axes (titles, limits, format, log scale, ticks), mark_lines / mark_points; style rules
# draw the rest: series { curve, fill, color }, point, grid lines, the legend. The style
# rules every chart takes are in css.yaml.

title: "Line chart"
description: |
  A line chart draws one or more series over an x axis: `x_column` and `y_column` (or
  `y_columns`, or `series_column` for long data). The default is a braille canvas; the
  style rule `chart { canvas }` picks another pixel grid and `chart { renderer: asciichart }`
  draws box lines.
  See `:help dbdash-charts`.

database:
  url: "sqlite:///:memory:"

show:
  interval: 5m

style:
  dashboard: { grid-template-columns: 2 }

panels:
  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d:00', n) AS hour, 60 + 40 * sin(n / 3.0) + abs(random() % 20) AS visits,
               (60 + 40 * sin(n / 3.0)) * 0.6 AS mobile, (60 + 40 * sin(n / 3.0)) * 0.4 AS desktop
        FROM h
    show:
      type: line
      title: "y_columns, legend, axes (canvas: braille, the default)"
      description: |
        Three series from `y_columns`, each with a `label`, colored by `series.<label>`
        rules; the legend sits on the `right` (default) or `bottom` (`legend { position }`);
        `axes.y_axis` sets a title, `min_value` and a Python `format` for the tick labels.
        Braille draws 2 x 4 dots per character.
      x_column: hour
      y_columns:
        - { column: visits, label: All }
        - { column: mobile, label: Mobile }
        - { column: desktop, label: Desktop }
      axes:
        x_axis: { title: "Hour" }
        y_axis: { title: "Visits", min_value: 0, format: "{:,.0f}" }
    style:
      "series.All": { color: "#61afef" }
      "series.Mobile": { color: "#e06c75" }
      "series.Desktop": { color: "#98c379" }
      countdown: { display: block, content: "Next update: {time}s" }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "chart { canvas: quadrant }"
      description: "`chart { canvas: quadrant }`: 2 x 2 pixels per character (▗▄▖), works in most fonts."
      x_column: hour
      y_column: visits
    style:
      chart: { canvas: quadrant }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "chart { canvas: block }"
      description: "`chart { canvas: block }`: one full block per pixel (coarse but bold)."
      x_column: hour
      y_column: visits
    style:
      chart: { canvas: block }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "chart { canvas: halfblock }"
      description: "`chart { canvas: halfblock }`: 1 x 2 pixels per character (▀ ▄)."
      x_column: hour
      y_column: visits
    style:
      chart: { canvas: halfblock }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "chart { canvas: ascii }"
      description: "`chart { canvas: ascii }`: plain ASCII characters, for any terminal or font."
      x_column: hour
      y_column: visits
    style:
      chart: { canvas: ascii }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "chart { renderer: asciichart }"
      description: |
        `chart { renderer: asciichart }` draws the line with box characters (╭─╯) instead of a
        pixel canvas. Try it on any line chart with `:DbDashStyle line asciichart`.
      x_column: hour
      y_column: visits
    style:
      chart: { renderer: asciichart }

  - query:
      sql: |
        WITH RECURSIVE d(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM d WHERE n < 13)
        SELECT printf('%02d', n) AS day, k AS region, 50 + abs(random() % 50) AS orders
        FROM d, (SELECT 'EU' AS k UNION ALL SELECT 'US' UNION ALL SELECT 'APAC')
    show:
      type: line
      title: "series_column: long data"
      description: |
        Long data (one row per x and series) with `series_column`: one line per value of
        `region`, colored from the palette (`chart { palette: tableau }` here; `theme`
        follows the colorscheme); `legend { position: bottom }` puts the legend below.
      x_column: day
      y_column: orders
      series_column: region
    style:
      chart: { palette: tableau }
      legend: { position: bottom }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 11)
        SELECT n AS x, 20 + 15 * sin(n / 2.0) AS y FROM h
    show:
      type: line
      title: "series { fill }, point { display: block }"
      description: "`series { fill: true }` fills under the line (Chart.js `fill`); `point { display: block }` marks every point."
      x_column: x
      y_column: y
    style:
      series: { fill: true }
      point: { display: block }

  - query:
      sql: |
        SELECT 1 AS t, 3 AS level UNION ALL SELECT 2, 3 UNION ALL SELECT 3, 7 UNION ALL SELECT 4, 5
        UNION ALL SELECT 5, 9 UNION ALL SELECT 6, 9 UNION ALL SELECT 7, 4
    show:
      type: line
      title: "series { curve: step-after }"
      description: |
        Steps instead of slopes (Chart.js `stepped`): `curve: step` / `step-before` (the
        value changes at the start), `step-after`, `step-middle`. Good for states and
        counters.
      x_column: t
      y_column: level
    style:
      series: { curve: step-after }

  - query:
      sql: |
        SELECT 1 AS t, 4 AS v UNION ALL SELECT 2, 6 UNION ALL SELECT 3, NULL UNION ALL SELECT 4, NULL
        UNION ALL SELECT 5, 8 UNION ALL SELECT 6, 5 UNION ALL SELECT 7, 7
    show:
      type: line
      title: "point { content }, span_gaps: false"
      description: |
        `point { display: block, content: "●" }` marks each point with a character (Chart.js
        `pointStyle`); `span_gaps: false` leaves a gap where the value is NULL instead of
        joining across it.
      x_column: t
      y_column: v
      span_gaps: false
    style:
      point: { display: block, content: "●" }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 11)
        SELECT n AS month, round(power(2.4, n)) AS users FROM h
    show:
      type: line
      title: "axes: scale: log, ticks; grid lines"
      subtitle: "users per month, log scale"
      description: |
        A log y axis (Chart.js `type: logarithmic`) for growth over orders of magnitude;
        `ticks` asks for about that many x ticks, `grid.x` / `grid.y { display: block }` draw
        grid lines at the ticks.
        `subtitle` adds a muted line under the title.
      x_column: month
      y_column: users
      axes:
        x_axis: { ticks: 6 }
        y_axis: { scale: log }
    style:
      "grid.x": { display: block }
      "grid.y": { display: block }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 50 + 30 * sin(n / 4.0) + abs(random() % 15) AS latency FROM h
    show:
      type: line
      title: "mark_lines, mark_points"
      description: |
        Reference lines (ECharts `markLine`): a fixed value with a label, or `mean`, `min`,
        `max` of the data, on the `y` (default) or `x` axis; a line's `class` styles it
        (`mark.slo { color }`). `mark_points` labels each series' `max` and `min` (ECharts
        `markPoint`).
      x_column: hour
      y_column: latency
      mark_lines:
        - { value: 90, label: "SLO 90 ms", class: slo }
        - { value: mean }
        - { value: "12", axis: x, label: "noon" }
      mark_points: [max, min]
    style:
      mark.slo: { color: "#e06c75" }

  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < 23)
        SELECT printf('%02d', n) AS hour, 60 + 40 * sin(n / 3.0) AS visits FROM h
    show:
      type: line
      title: "x_label, y_label; plot height, chart max-width, no legend"
      description: |
        `x_label` / `y_label` are short for the axis titles; `plot { height }` fixes the plot
        rows, `chart { max-width }` caps the chart width; `legend { display: none }` hides
        the legend.
      x_column: hour
      y_column: visits
      x_label: "hour of day"
      y_label: "visits"
    style:
      plot: { height: 6 }
      chart: { max-width: 60 }
      legend: { display: none }
