# JSON Schema (draft-07, written in YAML) for dbdash.nvim dashboard
#   configs.
#
# Editors with yaml-language-server pick it up from a modeline at the top
#   of a
#     config:
#   # yaml-language-server: $schema=./dbdash.schema.yaml
#
# The sidebar (:DbDash) does not list *.schema.yaml files (default
#   sidebar.exclude).
#
# Defaults below marked "setup" can be changed for all configs with
# require("dbdash").setup({ defaults = { ... } }); see :help dbdash-setup.
#
# Result format (:help dbdash-result) - referred to by query.sql (lua://,
#   http(s)://,
#     the
# push sources) and query.transform below. Every query goes: query ->
#   query.transform
#     (if
# any) -> a check that the result is rows. SQL databases, Redis, MongoDB
#   and
#     Cassandra
# return rows; a lua:// script, an HTTP response (decoded JSON), an item of
#   a push
#     source
# (luastream://, exec://, webhook://: JSON text) and a transform must
#   return one
#     of:
#   { columns = { "a", "b" }, rows = { { 1, "x" } } }        rows by
#   position
#   { columns = { "a", "b" }, rows = { { a = 1, b = "x" } } } rows by name
#   { { a = 1, b = "x" }, ... }                               records
#   (columns sorted
#     by
#                                                             name, or a
#   columns
#     list)
# In JSON: [{"a": 1}] or {"columns": ["a"], "rows": [[1]]}. nil / null is
#   NULL;
#     column
# types follow the first non-NULL value; query.max_rows applies. Anything
#   else
#     (an
# object such as {"data": [...]}, a number, text) is an error that suggests
#   a transform.
$schema: "http://json-schema.org/draft-07/schema#"
$id: "dbdash.schema.yaml"
title: dbdash.nvim dashboard
description: >-
  One dashboard: either a single chart (database / query / show) or several
  panels (panels). Top-level bare fields (interval, args, style) are
  dashboard-wide; the top-level database, query and show are the panels'
  defaults (without panels: the only panel). All appearance is in style
  sheets (style, panels[].style). See :help dbdash-config.
type: object
if: { required: [panels] }
then:
  # With panels the top-level query and show are defaults: fields
  #   describing one
  #     chart
  # belong in each panel.
  properties:
    query:
      properties: { sql: false, transform: false, args: false }
    show:
      properties:
        type: false
        title: false
        subtitle: false
        description: false
        column_list: false
        x_label: false
        y_label: false
      patternProperties: { "_columns?$": false }
else:
  required: [database] # query too, except for webhook://
properties:
  database:
    $ref: "#/definitions/database"
    description: >-
      The database of a single chart; with panels, the default of every
      panel that does not set its own (replaced as a whole by a panel's
      database; optional when every panel sets one).
  query:
    $ref: "#/definitions/query"
    description: >-
      The single chart's query; with panels, defaults of every panel's
      query (timeout, max_rows, autoescape).
  show:
    $ref: "#/definitions/show"
    description: >-
      The single chart's show; with panels, defaults of every panel's show
      (interval, args_show, refresh_hidden, axes, ...), merged key by key.
  interval:
    $ref: "#/definitions/duration"
    description: >-
      Global refresh: when it elapses every panel refreshes and the panels'
      own timers restart. Also the last default of show.interval (after the
      top-level show.interval). At least 1s.
  title:
    type: string
    description: >-
      The dashboard's title: on the header line above the charts, in
      notifications and :DbDashStatus, and meta.dashboard_title.
  description:
    type: string
    description: >-
      The dashboard's description: a template (the shared args; meta
      without panel fields; it cannot assign arguments) whose result is
      Markdown, shown by K / :DbDashDescribe; ⓘ in the header says there is
      one.
  args:
    type: array
    description: >-
      Shared arguments: every panel can use them. A panel's query.args are
      its own (only that panel sees them) and shadow a shared argument of
      the same name there. On the command line name=value sets every
      argument of that name, <panel id>.name=value one panel's own (a local
      name nothing else has is plain name too).
    items: { $ref: "#/definitions/arg" }
  style:
    $ref: "#/definitions/style"
    description: >-
      The dashboard's style sheet (author origin): above setup({ style }),
      below a panel's own style. The grid is dashboard {
      grid-template-columns, ... }; see :help dbdash-css.
  panels:
    type: array
    minItems: 1
    description: >-
      Charts in a CSS grid (style dashboard { grid-template-* }, panel {
      grid-* }).
    items: { $ref: "#/definitions/panel" }
additionalProperties: false

definitions:
  duration:
    description: >-
      Seconds as a number, or a string with a unit: "500ms", "30s", "5m",
      "1h".
    oneOf:
      - { type: number, minimum: 0 }
      - type: string
        pattern: "^\\s*\\d+(\\.\\d+)?\\s*(ms|s|m|h)?\\s*$"

  database:
    type: object
    required: [url]
    additionalProperties: false
    # Each driver reads its own options (an unknown one is an error when
    #   the
    #     config
    # loads), by the URL's scheme; databases without options take none.
    allOf:
      - if:
          required: [url]
          properties: { url: { pattern: "^sqlite3?://" } }
        then:
          properties:
            options:
              propertyNames: { enum: [lib_path, readonly, create] }
      - if:
          required: [url]
          properties: { url: { pattern: "^exec://" } }
        then:
          properties:
            options:
              propertyNames:
                enum:
                  - interpreter
                  - capture
                  - delimiter
                  - ok_codes
                  - cwd
                  - env
                  - stdin
      - if:
          required: [url]
          properties: { url: { pattern: "^luastream://" } }
        then:
          properties:
            options: { propertyNames: { enum: [cwd, delimiter] } }
      - if:
          required: [url]
          properties: { url: { pattern: "^webhook://" } }
        then:
          properties:
            options:
              propertyNames:
                enum:
                  - tokens
                  - delimiter
                  - stream_types
                  - max_body
                  - max_connections
                  - timeout
                  - allowed_origins
                  - allowed_hosts
      - if:
          required: [url]
          properties:
            url:
              not: { pattern: "^(sqlite3?|exec|luastream|webhook)://" }
        then:
          properties:
            options: { maxProperties: 0 }
    properties:
      type:
        description: >-
          Database type; inferred from the URL scheme when omitted.
        enum:
          - sqlite
          - sqlite3
          - postgres
          - postgresql
          - mysql
          - mariadb
          - redis
          - rediss
          - mongodb
          - cassandra
          - cql
          - mssql
          - sqlserver
          - lua
          - http
          - https
          - luastream
          - exec
          - webhook
      url:
        type: string
        description: |-
          Connection URL:
            <scheme>://[user[:password]@]host[:port][/database][?k=v]
          User names and passwords are percent-decoded (write @ as %40, :
          as %3A). ${NAME} is replaced by the environment variable NAME
          ($${ for a literal ${). Without a password in the URL:
          password_cmd, then stdpath("data")/dbdash/passwords.json (see
          :help dbdash-passwords).

          SQLite      sqlite:///absolute/path.db     (or sqlite3://)
                      sqlite://relative/to/this/config.db
                      sqlite:///:memory:
          PostgreSQL  postgres://user:pass@host:5432/db  (or postgresql://)
                      auth: cleartext, md5, SCRAM-SHA-256;
                      ?options=-c%20search_path%3Dapp
          MySQL       mysql://user:pass@host:3306/db     (or mariadb://)
                      auth: mysql_native_password, caching_sha2_password
          Redis       redis://[user]:pass@host:6379/0    (rediss://: TLS)
          MongoDB     mongodb://user:pass@host:27017/db?authSource=admin
                      mongodb://user:pass@h1:27017,h2:27017/db
                        ?readPreference=secondaryPreferred
                      mongodb+srv://user:pass@cluster0.example.net/db
                        (SRV + TXT lookup, defaults to tls=verify-full;
                        ?dns=host:port picks the name server)
                      ?authMechanism=SCRAM-SHA-256|SCRAM-SHA-1
          Cassandra   cassandra://user:pass@host:9042/keyspace (or cql://)
                        ?consistency=LOCAL_QUORUM
          SQL Server  mssql://user:pass@host:1433/db     (or sqlserver://)
                      with TLS: TLS negotiated inside TDS;
                      &encrypt=strict for TDS 8
          Lua         lua://   query.sql is Lua code returning rows
                      (:help dbdash-lua)
          HTTP        https://user:pass@api.example.com/v1?key=value
                      (or http://) query.sql is a curl command
                      (:help dbdash-http); https defaults to
                      tls=verify-full; other ?parameters go to the server

          Push sources: data arrives instead of being queried
          (:help dbdash-push)
          Lua stream  luastream://   query.sql is Lua whose print() /
                      io.write() output is the data
                      (:help dbdash-luastream)
          Script      exec://   query.sql is a script; its output is the
                      data (:help dbdash-exec)
          Webhook     webhook://127.0.0.1:8765/path   an HTTP endpoint;
                      query.sql is an OpenAPI document
                      (:help dbdash-webhook)

          Common parameters:
            tls=disable|require|pin|verify-ca|verify-full
                                                 (default disable)
            fingerprint=sha256:AB:CD:...         (required for tls=pin)
            ca=path/to/ca.pem                    (verify-*: trusted CAs
                                                  instead of the system
                                                  store; relative to this
                                                  config file)
            tls_host=name                        (name to verify instead of
                                                  host)
            connect_timeout=10s   timeout=30s    (defaults: setup)
            application_name=dbdash.nvim
        examples:
          - "sqlite:///:memory:"
          - "sqlite://data/app.db"
          - "postgres://app:secret@db.internal:5432/app?tls=verify-full"
          - "mysql://report:secret@127.0.0.1:3306/shop?tls=require"
          - "redis://:secret@cache:6379/0"
          - "mongodb+srv://reader:secret@cluster0.example.net/shop"
          - "cassandra://cassandra:cassandra@127.0.0.1:9042/metrics"
          - "mssql://sa:pw@sqlhost/master?tls=pin&fingerprint=sha256:AB:"
          - "lua://"
          - "https://api.example.com/v1?api_key=${API_KEY}"
          - "luastream://"
          - "exec://"
          - "webhook://127.0.0.1:8765/events"
      password_cmd:
        description: >-
          Command printing the password (first line), used when the URL has
          none. A string runs through sh -c (cmd /c on Windows); a list
          runs directly. It runs in Neovim's current directory.
        oneOf:
          - { type: string, minLength: 1 }
          - { type: array, minItems: 1, items: { type: string } }
        examples: ["pass show db/app"]
      options:
        type: object
        description: >-
          Driver options: each driver reads its own (SQLite, exec://,
          luastream://, webhook://); the other databases take none. An
          unknown one is an error.
        properties:
          lib_path:
            type: string
            description: "SQLite: path of the libsqlite3 library to load."
          readonly:
            type: boolean
            description: "SQLite: open the file read-only."
          create:
            type: boolean
            description: >-
              SQLite: create the file when it does not exist (default
              false).
          delimiter:
            type: string
            minLength: 1
            description: >-
              Push sources: what separates items in the output or a
              streamed request body (default "\n"; a "\r" before it is
              dropped).
          cwd:
            type: string
            description: >-
              exec:// and luastream://: the working directory (default:
              this config file's directory; relative to it).
          interpreter:
            type: array
            minItems: 1
            items: { type: string }
            description: >-
              exec://: the program running the script, the script being its
              last argument (default ["sh", "-c"], ["cmd.exe", "/d", "/s",
              "/c"] on Windows).
            examples:
              - ["bash", "-c"]
              - ["python3", "-c"]
              - ["pwsh", "-Command"]
          capture:
            enum: [stdout, stderr, both]
            description: >-
              exec://: which output is the data (default stdout); each item
              knows its stream.
          ok_codes:
            type: array
            minItems: 1
            items: { type: integer }
            description: >-
              exec://: exit codes that end normally (default [0]); others
              fail with the end of stderr.
          env:
            type: object
            additionalProperties: { type: [string, number, boolean] }
            description: >-
              exec://: environment variables added to Neovim's.
          stdin:
            type: string
            description: >-
              exec://: text written to the script's stdin (then closed).
          tokens:
            type: object
            description: >-
              webhook://: the credentials of the OpenAPI document's
              security schemes, by scheme name: a token (http bearer,
              apiKey), "user:password" (http basic), or a list of them. Use
              ${NAME} to read them from the environment.
          stream_types:
            type: array
            items: { type: string }
            description: >-
              webhook://: more media types whose bodies are cut into items
              at the delimiter.
          max_body:
            type: [string, integer]
            description: >-
              webhook://: the largest request body (default "10MB"; larger
              ones get 413).
          max_connections:
            type: integer
            minimum: 1
            description: >-
              webhook://: connections at the same time (default 16; more
              are closed).
          timeout:
            $ref: "#/definitions/duration"
            description: >-
              webhook://: time to send the headers and each part of the
              body (default 10s; then 408).
          allowed_origins:
            type: array
            items: { type: string }
            description: >-
              webhook://: Origin values accepted (browsers send one;
              default none). Requests without an Origin are accepted.
          allowed_hosts:
            type: array
            items: { type: string }
            description: >-
              webhook://: more Host names accepted besides the listening
              address and localhost.

  arg:
    type: object
    required: [name]
    additionalProperties: false
    not:
      required: [key]
      description: "'key:' is not supported; use 'name:'."
    properties:
      name:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: >-
          Argument name, used as args.<name> in templates and Lua code.
      type:
        enum: [string, number, int, boolean, list, map]
        default: string
        description: >-
          How command-line / prompt input is parsed: list "a,b,c", map
          "k:v,k2:v2", boolean true/false/1/0/yes/no. Escape , and : with a
          backslash or quotes.
      default:
        description: >-
          Value when nothing else sets it (an argument without a value is
          none).
      required:
        type: boolean
        default: false
        description: Ask for a value at start when it has none.
      show:
        type: boolean
        default: true
        description: >-
          Include the argument in show.args_show lines (when args_show is
          true).
      description: { type: string }
      choices:
        type: array
        description: Candidates for completion and prompts.

  query:
    type: object
    description: >-
      The query; sql is required except for webhook:// (empty: POST or PUT
      of anything). For http(s):// it is a curl command (curl alone GETs
      the URL).
    additionalProperties: false
    properties:
      sql:
        type: string
        description: |-
          Query template (Jinja2, see :help dbdash-templates): arguments
            are
          {{ args.<name> }}, metadata {{ meta.<name> }} (:help dbdash-meta,
            e.g.
          run records with ids, times and results: meta.run (meta.run.kind:
            "refresh"
              or
          "callback"; meta.run.depth: 0 in a refresh, n in a callback),
            meta.runs,
          meta.prev, meta.prev_ok (the last successful refresh, its rows in
          meta.prev_ok.result): :help dbdash-runs), and
          {% set args.<name> = value %} sets an argument (:help
            dbdash-assign-args).
              Lua
          runs in {% lua %} ... {% endlua %} blocks and in modules imported
            with
          {% import 'x.lua' as h %} (:help dbdash-template-lua), with args,
            meta, store
              and
          the dbdash.* helpers (dbdash.run(args): this query again with
            other
              arguments);
          a config with Lua is trusted once, with the files it imports
            (:help
              dbdash-lua).
          Its language depends on the database:
            SQL databases  SQL (T-SQL for SQL Server, CQL for Cassandra)
            Redis          one command, e.g. HGETALL "user:1001"
            MongoDB        a JSON document:
                           {"collection": "orders", "operation": "find",
                            "filter": {...}, "projection": {...}, "sort":
                              {...},
                            "limit": 100, "flatten": 1}
                           operation: find | aggregate (pipeline) | count |
                           distinct (field) | command (command)
            lua://         Lua code returning rows (see "Result format" at
                           the
                             top
                           of this file, :help dbdash-result), or a value
                             that
                           query.transform turns into rows; it sees args,
                             meta,
                           store and dbdash.system/query/sleep/run (:help
                           dbdash-lua)
            luastream://   Lua code whose print() / io.write() output is
                           cut
                             into
                           items (dbdash.emit(value) passes one as it is)
            exec://        a script run by database.options.interpreter
            webhook://     an OpenAPI 3.1 document (YAML or JSON)
                           describing
                             the
                           requests it accepts (empty: POST or PUT of
                             anything)
            http(s)://     a curl command whose URL is a path under
                           database.url
                           (curl alone: GET the URL), with curl's options
                             and
                           defaults, e.g.
                             curl -X POST /search -H 'X-Token: t' -G \
                               --data-urlencode q=x -b jar.txt -c jar.txt \
                               --json '{"limit": 5}' -L
                           (query.autoescape writes {{ }} values as shell
                             words;
                           -c writes a cookie file next to the config);
                           JSON responses are decoded, other bodies stay
                             text;
                               the
                           result must be rows ("Result format", :help
                           dbdash-result): a JSON list of objects or
                             {"columns",
                           "rows"} shows directly, anything else needs
                           query.transform (:help dbdash-http)
      transform:
        type: string
        description: |-
          Lua code that reshapes the result of any database before it is
            shown (after
              the
          same template as query.sql - args, meta, {% lua %}, .lua imports
            - without
          autoescape; :help dbdash-transform). Every query goes:
          query -> transform -> rows check. It gets
            rs        SQL and other databases: { columns (names), types,
                      rows (nil
                        for
                      NULL) }; lua://: the script's value; http(s)://: the
                        decoded
                          body;
                      push sources: one item (text, or what dbdash.emit()
                        or a
                          request
                      gave; :help dbdash-push)
            response  http(s)://: { status, reason, headers, body, url }
            stream    exec://: "stdout" or "stderr", the stream the item
                      came
                        from
            params    webhook://: { path, query, header, cookie },
                      converted
            request   webhook://: { method, path, operation_id,
                      content_type, headers
                        }
            args      the arguments, meta the metadata, store the panel's
                      table kept
                        while
                      the dashboard runs, and the dbdash.* helpers
                        (dbdash.run(args)
                      runs this panel's query again with other arguments)
          and returns rows (see "Result format" at the top of this file,
            :help
          dbdash-result). Configs with Lua ask for trust first (:help
            dbdash-lua).
      args:
        type: array
        description: >-
          This chart's own arguments (only its templates see them); one
          with the name of a shared (top-level) argument shadows it here.
        items: { $ref: "#/definitions/arg" }
      autoescape:
        type: boolean
        default: false
        description: >-
          Render {{ x }} as SQL literals of the database's dialect (| safe
          opts out).
      max_rows:
        type: integer
        minimum: 1
        default: 10000
        description: >-
          Rows read at most (default 10000, setup defaults.max_rows).
      timeout:
        $ref: "#/definitions/duration"
        description: >-
          Query timeout (default the URL's timeout, else 30s from setup
          defaults.timeout).

  panel:
    type: object
    description: >-
      One chart; query is required except for http(s):// (a GET of the URL)
      and webhook://.
    additionalProperties: false
    properties:
      id:
        type: string
        pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        description: >-
          Name of the panel for its local arguments on the command line
          (<id>.name=value); default its number (1, 2, ...).
      database:
        $ref: "#/definitions/database"
        description: >-
          This panel's database; default the top-level database (replaced
          as a whole). A panel needs one of the two.
      query: { $ref: "#/definitions/query" }
      show: { $ref: "#/definitions/show" }
      style:
        $ref: "#/definitions/style"
        description: >-
          This panel's style sheet (inline origin): its rules match only in
          this panel and win over the dashboard's (e.g. panel {
          grid-column: "span 2" }, chart { renderer: vertical }).

  series:
    oneOf:
      - type: string
      - type: object
        required: [column]
        properties:
          column: { type: string }
          label:
            type: string
            description: >-
              The legend label; series.<label> in style sheets.

  track:
    description: >-
      A grid track: an integer, "N%", "Nfr", auto, min-content, max-content
      or "minmax(a, b)".
    oneOf:
      - { type: integer, minimum: 0 }
      - { type: string }

  color:
    type: string
    description: >-
      Hex ("#3498db"), a color name ("blue", "bright_blue"), or an existing
      highlight group ("DiagnosticOk").

  class:
    type: string
    pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
    description: >-
      A class name for style sheets (.<class>); success, info, warning and
      danger are colored by default.

  show:
    type: object
    properties:
      type:
        enum:
          - table
          - line
          - area
          - bar
          - histogram
          - boxplot
          - heatmap
          - bubble
          - pie
          - scatter
          - stat
          - text
        default: table
      title: { type: string }
      subtitle:
        type: string
        description: "A muted line under the title (Chart.js subtitle)."
      description:
        type: string
        description: >-
          This chart's description: a template (args, meta, as its query
          sees them; it cannot assign arguments) whose result is Markdown,
          shown by K / :DbDashDescribe; ⓘ after the panel's title (in a
          one-chart dashboard: in the header) says there is one. With
          panels, it belongs in each panel.
      interval:
        $ref: "#/definitions/duration"
        description: >-
          Refresh interval of this chart (default the top-level
          show.interval, then the top-level interval, else 30s from setup
          defaults.interval). At least 1s.
      refresh_hidden:
        type: boolean
        default: false
        description: >-
          Keep refreshing this chart while the dashboard is not visible
          (paused, see dashboard.pause_hidden in setup): thresholds and
          errors still notify.
      args_show:
        description: >-
          Show argument values above this chart: true for the arguments its
          query reads (and its own query.args; not those with show: false),
          or a list of names.
        oneOf:
          - type: boolean
          - { type: array, items: { type: string } }
        default: false
      axes:
        type: object
        properties:
          x_axis: { $ref: "#/definitions/axis" }
          y_axis: { $ref: "#/definitions/axis" }
      stacked:
        description: >-
          area: stack the series (true), or stack them to 100% (percent);
          bar: segments on top of each other (true).
        oneOf:
          - type: boolean
          - const: percent
      sort:
        description: >-
          table: order the rows (DataTables order): a column name, or {
          column, order: asc | desc }; NULLs last. bar, pie: asc or desc by
          value.
        oneOf:
          - type: string
          - type: object
            properties:
              column: { type: string }
              order: { enum: [asc, desc] }
      top:
        type: integer
        minimum: 1
        description: >-
          bar: keep the first N bars (after sort); pie: the first N slices
          and one for the rest.
      other_label:
        type: string
        description: >-
          pie: the slice of what top leaves out (default "Other"; styled as
          series.other).
      cumulative:
        type: boolean
        description: "histogram: add the bins up."
      normalize:
        enum: [count, percent, density]
        description: "histogram: counts, shares of all values, or density."
      whiskers:
        description: >-
          boxplot: whiskers at 1.5 IQR (iqr, default), the extremes
          (minmax), or two percentiles ([5, 95]).
        oneOf:
          - enum: [iqr, minmax]
          - type: array
            minItems: 2
            maxItems: 2
            items: { type: number, minimum: 0, maximum: 100 }
      scale_min:
        type: number
        description: >-
          heatmap: the value at the low end of the colors (default the
          smallest value).
      scale_max:
        type: number
        description: >-
          heatmap: the value at the high end of the colors (default the
          largest value).
      trend_line:
        const: linear
        description: >-
          scatter, bubble, line: a dashed least-squares line per series.
      size_range:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number, minimum: 0 }
        description: >-
          bubble: smallest and largest radius, in canvas pixels.
      span_gaps:
        type: boolean
        default: true
        description: >-
          line, area: false: a NULL breaks the line (Chart.js spanGaps).
      separator:
        type: string
        description: 'text: between the cells of a row (default " ").'
      reverse:
        type: boolean
        description: "text: the last row first (newest on top)."
      highlight:
        type: array
        description: >-
          text: give lines that match a Vim regex a class (line.<class> in
          style; default warning); the first rule that matches wins.
        items:
          type: object
          required: [pattern]
          additionalProperties: false
          properties:
            pattern: { type: string }
            class: { $ref: "#/definitions/class" }
      row_thresholds:
        type: object
        description: >-
          table: a class on whole rows by one column's value (AG Grid
          rowStyle); row.<class> in style.
        properties:
          column: { type: string }
          steps: { $ref: "#/definitions/thresholds" }
          below:
            type: boolean
            description: "Steps apply at or below their value."
      x_label: { type: string }
      y_label: { type: string }
      x_column: { type: string }
      y_column: { type: string }
      y_columns:
        type: array
        items: { $ref: "#/definitions/series" }
      mark_lines:
        type: array
        description: >-
          Reference lines (ECharts markLine): a value, or mean / min / max
          of the data.
        items:
          type: object
          properties:
            value:
              anyOf:
                - { type: number }
                - { enum: [mean, average, min, max] }
                - { type: string }
              description: >-
                A number, mean, min, max, or (x axis) a category.
            axis: { enum: [x, y], default: y }
            label: { type: string }
            class:
              $ref: "#/definitions/class"
              description: >-
                A class on the line: mark.<class> in style colors it.
      mark_points:
        type: array
        description: >-
          Mark each series' max / min point with its value (ECharts
          markPoint).
        items: { enum: [max, min] }
      value_column:
        type: string
        description: >-
          histogram, boxplot, heatmap, pie; stat: the value (default the
          first numeric column).
      category_column: { type: string }
      label_column: { type: string }
      size_column: { type: string }
      color_column: { type: string }
      bins: { type: integer, minimum: 1 }
      bin_width:
        type: number
        exclusiveMinimum: 0
        description: >-
          histogram: the width of every bin (Vega-Lite bin.step).
      bin_range:
        type: array
        minItems: 2
        maxItems: 2
        items: { type: number }
        description: >-
          histogram: where the bins start and end (Vega-Lite bin.extent).
      format:
        type: string
        description: >-
          stat and pie: Python format of the values, e.g. "{:,}", "{:.1f}",
          "{:.1%}", "{:.0f} ms".
      unit:
        type: string
        description: "stat: text shown after the value."
      prefix:
        type: string
        description: 'stat: text shown before the value, e.g. "$".'
      label:
        type: string
        description: "stat: a muted line under the value."
      reduce:
        enum: [first, last, mean, min, max, sum, count]
        default: first
        description: >-
          stat: which value of the rows (Grafana reduceOptions.calcs).
      delta_mode:
        enum: [percent, absolute]
        default: percent
        description: "stat: the change as a percentage or an amount."
      sparkline_length:
        type: integer
        minimum: 2
        default: 20
        description: "stat: how many refreshes the sparkline shows."
      value_columns:
        type: array
        description: >-
          stat: several values side by side, each a column name or {
          column, label, format, unit, prefix }.
        items:
          oneOf:
            - type: string
            - type: object
              required: [column]
              properties:
                column: { type: string }
                label: { type: string }
                format: { type: string }
                unit: { type: string }
                prefix: { type: string }
      thresholds:
        $ref: "#/definitions/thresholds"
        description: >-
          stat: a class on the value by thresholds (value.<class> in
          style); notify: true notifies when the value rises to a step.
      thresholds_below:
        type: boolean
        default: false
        description: >-
          Thresholds apply at or below their value (lower is worse).
      column_list:
        type: array
        description: >-
          Table (and text) columns to show, in order (all columns when
          omitted).
        items:
          oneOf:
            - type: string
            - type: object
              required: [column]
              properties:
                column: { type: string }
                alias: { type: string }
                width:
                  type: integer
                  minimum: 1
                  description: "Column width (cells wrap inside it)."
                height:
                  type: integer
                  minimum: 1
                  description: >-
                    Most lines a cell takes; longer ends with …
                align:
                  enum: [left, center, right]
                  description: "Text alignment (default: numbers right)."
                format:
                  type: string
                  description: >-
                    Python format of numbers, e.g. "{:,.2f}", "{:.1%}".
                thresholds:
                  $ref: "#/definitions/thresholds"
                  description: >-
                    A class on the cells of this column by value
                    (cell.<class> in style; notify works as for stat).
                thresholds_below: { type: boolean, default: false }
    allOf:
      - if:
          properties: { type: { enum: [line, area, bar] } }
          required: [type]
        then:
          required: [x_column]
          anyOf: [{ required: [y_column] }, { required: [y_columns] }]
      - if:
          properties: { type: { enum: [scatter, bubble] } }
          required: [type]
        then: { required: [x_column, y_column] }
      - if:
          properties: { type: { enum: [histogram, boxplot] } }
          required: [type]
        then: { required: [value_column] }
      - if: { properties: { type: { const: heatmap } }, required: [type] }
        then: { required: [x_column, y_column, value_column] }
      - if: { properties: { type: { const: pie } }, required: [type] }
        then: { required: [label_column, value_column] }

  thresholds:
    type: array
    description: >-
      Steps from least to most severe; a value at or above a step's value
      (at or below with thresholds_below) reaches it and the most severe
      step reached wins: its class goes on the element (value, cell, row).
      The default sheet colors success, info, warning and danger.
    items:
      type: object
      required: [value]
      additionalProperties: false
      properties:
        value: { type: number }
        class: { $ref: "#/definitions/class" }
        notify:
          type: boolean
          default: false
          description: "vim.notify once when the value rises to this step."

  axis:
    type: object
    properties:
      title: { type: string }
      min_value: { type: number }
      max_value: { type: number }
      scale:
        enum: [linear, log]
        default: linear
        description: >-
          log: one tick per power of ten (Chart.js type: logarithmic).
      ticks:
        type: integer
        minimum: 2
        description: "About how many ticks (Chart.js ticks.count)."
      format:
        type: string
        description: 'Python format, e.g. "{:,.0f}" or "{:.1%}".'

  style:
    type: object
    description: |-
      A style sheet (:help dbdash-css): selector -> properties, as in CSS.
        Selectors:
          an
      element (dashboard, header, header-title, countdown, panel,
        panel-title, args,
          error,
      chart, title, subtitle, plot, axis, axis-title, label, legend,
        legend-item,
          grid,
      mark, series, point, bar, value, percent, unit, stat, delta,
        sparkline,
          table,
      header, row, cell, rule, lines, line, line-number, outlier, mean,
        ...; a
          chart's
      content has one element per item: a row, a cell, a bar, a legend
        item, ...),
          #id,
      .class, [attr] / [attr=value],
      :nth-child(odd | even | N), :first-child, :last-child, descendants
        ("panel
          title"),
      ::part(name) and comma lists. Later and more specific rules win;
        style sheets
          cascade
      default < setup({ style }) < the dashboard's style < a panel's style
        < :DbDashStyle.
    additionalProperties:
      type: object
      additionalProperties: false
      properties:
        color:
          $ref: "#/definitions/color"
          description: "Text color (inherited)."
        background-color: { $ref: "#/definitions/color" }
        font-weight: { enum: [normal, bold] }
        font-style: { enum: [normal, italic] }
        text-decoration:
          enum: [none, underline, undercurl, line-through]
        palette:
          type: string
          description: >-
            Series colors: theme (default, follows the colorscheme) or
            tableau (inherited).
        display:
          enum: [block, none]
          description: >-
            none hides the element (countdown, legend, value, point, mean,
            line-number, rule, ... are hidden by default).
        content:
          type: string
          description: >-
            Generated text: countdown ("Next update: {time}s"; {time},
            {clock}), description-icon ("ⓘ"), cell.null ("NULL"), point (a
            marker).
        text-align: { enum: [start, left, center, right] }
        vertical-align: { enum: [top, middle, bottom] }
        white-space:
          enum: [normal, nowrap]
          description: "nowrap: one line, cut with text-overflow."
        word-break:
          enum: [normal, break-all]
          description: "break-all: wrap anywhere, not only at spaces."
        text-overflow:
          type: string
          description: >-
            What marks cut text: ellipsis ("…"), clip (nothing) or a
            string.
        line-clamp:
          type: integer
          minimum: 1
          description: >-
            table: rows shown; text chart: lines shown (then how many
            more).
        font-size:
          enum: [normal, big]
          description: >-
            stat value: block digits (big, the default) or one line.
        caption-side:
          enum: [top, bottom]
          description: "title, panel-title: above or under the chart."
        border:
          description: >-
            Border line: single, rounded, heavy, double, dashed, ascii,
            rich (tables: heavy header), none; true / false.
          oneOf:
            - type: boolean
            - enum:
                - single
                - rounded
                - heavy
                - double
                - dashed
                - ascii
                - rich
                - none
        border-color: { $ref: "#/definitions/color" }
        padding:
          description: >-
            N, [vertical, horizontal], [top, horizontal, bottom] or [top,
            right, bottom, left].
          oneOf:
            - { type: integer, minimum: 0 }
            - type: array
              minItems: 1
              maxItems: 4
              items: { type: integer, minimum: 0 }
        width:
          type: integer
          minimum: 1
          description: "cell: column width; bar: columns / lines per bar."
        max-width:
          type: integer
          minimum: 1
          description: "chart: the widest it gets."
        height:
          type: integer
          minimum: 1
          description: "plot: plot rows; cell: most lines per cell."
        min-height:
          type: integer
          minimum: 1
          description: >-
            plot: smallest plot rows in a grid before it scrolls (default
            8).
        grid-template-columns:
          description: >-
            dashboard: column tracks: N equal columns, "1fr 2fr 30",
            "repeat(3, 1fr)" or a list; tracks are an integer, "N%", "Nfr",
            auto or "minmax(a, b)".
          oneOf:
            - { type: integer, minimum: 1 }
            - { type: string }
            - type: array
              minItems: 1
              items: { $ref: "#/definitions/track" }
        grid-template-rows:
          description: >-
            dashboard: the first row tracks (an integer, Nfr, auto,
            min-content, max-content, minmax(a, b)).
          oneOf:
            - { type: string }
            - { type: array, items: { $ref: "#/definitions/track" } }
        grid-auto-rows:
          $ref: "#/definitions/track"
          description: >-
            dashboard: rows past the declared ones (default auto).
        grid-template-areas:
          type: array
          items: { type: string }
          description: >-
            dashboard: named areas, one string per row ("a a b"), "." for
            an empty cell.
        column-gap:
          type: integer
          minimum: 0
          description: "dashboard: spaces between columns (default 2)."
        row-gap:
          type: integer
          minimum: 0
          description: "dashboard: blank lines between rows (default 1)."
        grid-area:
          type: string
          description: "panel: a name of grid-template-areas."
        grid-row:
          description: 'panel: N, "span M" or "N / span M".'
          oneOf:
            - { type: integer, minimum: 1 }
            - type: string
              pattern: "^(\\d+|span \\d+|\\d+ */ *span \\d+)$"
        grid-column:
          description: 'panel: N, "span M" or "N / span M".'
          oneOf:
            - { type: integer, minimum: 1 }
            - type: string
              pattern: "^(\\d+|span \\d+|\\d+ */ *span \\d+)$"
        justify-self:
          enum: [start, center, end, stretch]
          description: "panel: where the chart sits across its cell."
        align-self:
          enum: [start, center, end, stretch]
          description: "panel: where the chart sits down its cell."
        renderer:
          type: string
          description: |-
            chart: how the type is drawn (the first one is the default):
              table: box          line: canvas, asciichart
                                  scatter/area/bubble:
                                    canvas
              bar: horizontal, vertical    histogram: horizontal, vertical
              boxplot: boxdraw, vertical    heatmap: halfblock, block
                                            pie: bar,
                                              circle
              stat: big           text: plain
            Renderers registered with setup({ register = ... }) are
              accepted
                too.
        canvas:
          type: string
          description: >-
            chart: the pixel canvas: braille (default), quadrant, block,
            halfblock, ascii.
        curve:
          enum: [linear, step, step-before, step-after, step-middle]
          description: >-
            series: steps instead of slopes (Chart.js stepped).
        fill:
          type: boolean
          description: "series: fill down to zero (lines)."
        hole:
          type: number
          minimum: 0
          maximum: 0.9
          description: >-
            chart (pie circle): the hole, a fraction of the radius; 0.5+
            shows the total.
        angle:
          enum: [180, 360]
          description: "chart (pie circle): 180 draws the upper half."
        gap:
          type: integer
          minimum: 0
          description: "bar: columns or lines between categories."
        position:
          enum: [right, bottom, end, inside]
          description: >-
            legend: right or bottom; value: end or inside the bar.
        color-scale:
          type: array
          minItems: 1
          items: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
          description: >-
            chart (heatmap): the colors from low to high, "#rrggbb"
            (ECharts visualMap inRange.color).
        color-steps:
          type: array
          description: >-
            chart (heatmap): piecewise colors; a value takes the color of
            the highest step it reaches.
          items:
            type: object
            required: [value, color]
            properties:
              value: { type: number }
              color: { $ref: "#/definitions/color" }
