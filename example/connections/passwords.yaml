# yaml-language-server: $schema=../dbdash.schema.yaml
#
# Passwords outside the config (:help dbdash-passwords). Runs against `make it-up`. A
# password in the URL wins, then database.password_cmd, then passwords.json:
#
# - ${NAME} in database.url is replaced by the environment variable NAME:
#     url: "postgres://dbdash:${PGPASSWORD}@127.0.0.1:15432/dbdash_test"
#   (an unset variable is an error naming the line; $${ writes a literal ${).
# - password_cmd (below) runs a command and uses the first line it prints: a string runs
#   through sh -c (cmd /c on Windows), a list runs directly. Use e.g.
#   "pass show db/app", ["security", "find-generic-password", "-w", "-s", "db"] or
#   "op read op://vault/db/password". The output is kept until Neovim exits or the server
#   rejects it.
# - stdpath("data")/dbdash/passwords.json (~/.local/share/nvim/dbdash/passwords.json)
#   maps URLs without a password to passwords, most specific first:
#     { "postgres://dbdash@127.0.0.1:15432/dbdash_test": "dbdash_pw",
#       "redis://127.0.0.1:16379": "dbdash_pw" }
#   Keep it chmod 600 (:checkhealth dbdash warns otherwise).

title: "Passwords"

layout:
  columns: 2

show:
  interval: 1m

panels:
  - database:
      url: "postgres://dbdash@127.0.0.1:15432/dbdash_test"
      password_cmd: "echo dbdash_pw"           # a shell command (a demo: it just prints it)
    query:
      sql: SELECT current_user AS logged_in_as, current_database() AS db
    show:
      type: table
      title: "password_cmd as a string"

  - database:
      url: "mysql://dbdash@127.0.0.1:13306/dbdash_test"
      # A list runs without a shell (Neovim prints it here, so it works everywhere). The
      # command runs in Neovim's current directory.
      password_cmd: ["nvim", "--clean", "--headless", "+lua io.stdout:write('dbdash_pw')", "+qa!"]
    query:
      sql: SELECT CURRENT_USER() AS logged_in_as
    show:
      type: table
      title: "password_cmd as a list (no shell)"
