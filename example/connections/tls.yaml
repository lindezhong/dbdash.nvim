# yaml-language-server: $schema=../dbdash.schema.yaml
#
# TLS (:help dbdash-tls). Runs against `make it-up`, whose servers use the test
# certificates of tests/fixtures (not trusted by your system): ca= names their root,
# relative to this file. With your own servers verify-full needs no ca= when the
# certificate comes from a CA your system trusts.
#   tls=require      encrypt, do not check the certificate
#   tls=pin          the leaf certificate must have this SHA-256 fingerprint; get it with
#                      openssl s_client -connect host:5432 -starttls postgres </dev/null \
#                        2>/dev/null | openssl x509 -noout -fingerprint -sha256
#                    (a wrong one: the error shows the server's)
#   tls=verify-ca    the chain must lead to a trusted root (ca= or the system store)
#   tls=verify-full  verify-ca and the host name (the default of https:// and rediss://)

title: "TLS"
description: |
  TLS for every protocol: verify-full with a CA file, pinning the certificate, require,
  and HTTPS. Needs `make it-up` (its test certificates). See `:help dbdash-tls`.

layout:
  columns: 2

show:
  style: { title_align: center, border: rounded }
  interval: 1m

panels:
  - database:
      url: "postgres://dbdash:dbdash_pw@localhost:15432/dbdash_test?tls=verify-full&ca=../../tests/fixtures/pki/root.pem"
    query:
      sql: SELECT version AS tls, cipher, bits FROM pg_stat_ssl WHERE pid = pg_backend_pid()
    show:
      type: table
      title: "PostgreSQL, tls=verify-full with ca="
      description: |
        `tls=verify-full&ca=...`: the chain must lead to the given root and the host name must
        match; the row shows the TLS version and cipher PostgreSQL reports for this session.

  - database:
      url: "postgres://dbdash:dbdash_pw@127.0.0.1:15432/dbdash_test?tls=pin&fingerprint=sha256:3D:58:A4:52:C7:22:7E:C5:12:28:DB:DA:EC:28:95:D5:CD:B4:AD:AF:6F:4D:77:57:72:EE:FE:45:43:D0:1A:BC"
    query:
      sql: SELECT ssl, version FROM pg_stat_ssl WHERE pid = pg_backend_pid()
    show:
      type: table
      title: "PostgreSQL, tls=pin"
      description: |
        `tls=pin&fingerprint=sha256:...`: the server's certificate must have exactly this
        fingerprint (a wrong one fails and names the right one).

  - database:
      url: "mysql://dbdash:dbdash_pw@127.0.0.1:13306/dbdash_test?tls=require"
    query:
      sql: SHOW SESSION STATUS WHERE Variable_name IN ('Ssl_version', 'Ssl_cipher')
    show:
      type: table
      title: "MySQL, tls=require"
      description: |
        `tls=require` encrypts without checking the certificate; MySQL reports the version and
        cipher of the session.

  - database:
      url: "redis://:dbdash_pw@127.0.0.1:16380/0?tls=pin&fingerprint=sha256:9B:B6:9C:47:01:E8:B8:C7:29:C5:D5:37:A0:F1:FA:92:3F:78:38:DB:43:B5:83:94:C7:E5:D4:31:7E:D6:E2:52"
    query:
      sql: INFO server
    show:
      type: table
      title: "Redis, tls=pin"
      description: |
        Redis over TLS on port 16380 with a pinned fingerprint (`rediss://` would verify by
        default).

  - database:
      url: "https://localhost:18443?ca=../../tests/fixtures/pki/root.pem"
    query:
      sql: '{"path": "/items"}'
    show:
      type: table
      title: "HTTPS (verify-full by default) with ca="
      description: |
        HTTPS verifies the certificate and host name by default; `ca=` adds the test root.
      span: 2
