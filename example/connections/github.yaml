# yaml-language-server: $schema=../dbdash.schema.yaml
#
# https:// - query.sql describes an HTTP request as JSON (here a GET with parameters; empty
# means a GET of the URL). Like every query, the result then goes through query.transform
# and must be rows: the GitHub API returns a list of releases with nested assets, so the
# transform picks the fields and sums the downloads. dbdash asks whether you trust this
# file first, because of the transform (:help dbdash-http, :help dbdash-transform).
# Try: :DbDashStart http.yaml repo=folke/lazy.nvim

database:
  url: "https://api.github.com"

query:
  args:
    - name: repo
      type: string
      default: "neovim/neovim"
    - name: count
      type: int
      default: 10
  sql: |
    {
      "path": "/repos/{{ args.repo }}/releases",
      "query": {"per_page": {{ args.count }}},
      "headers": {"Accept": "application/vnd.github+json"}
    }
  transform: |
    local out = {}
    for _, r in ipairs(rs) do
      local downloads = 0
      for _, a in ipairs(r.assets or {}) do
        downloads = downloads + (a.download_count or 0)
      end
      out[#out + 1] = {
        release = r.tag_name,
        published = (r.published_at or ""):sub(1, 10),
        downloads = downloads,
        prerelease = r.prerelease,
      }
    end
    return { columns = { "release", "published", "downloads", "prerelease" }, rows = out }

show:
  args_show: true
  type: table
  title: "GitHub releases"
  interval: 10m # unauthenticated GitHub API calls are limited to 60 an hour
  column_list:
    - column: release
    - column: published
    - column: downloads
      alias: "Downloads"
    - column: prerelease
      alias: "Pre"
