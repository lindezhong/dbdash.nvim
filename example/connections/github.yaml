# yaml-language-server: $schema=../dbdash.schema.yaml
#
# https:// - query.sql is a curl command: a path under database.url, -G sending the data
# as URL parameters, a header (:help dbdash-http). With query.autoescape, {{ ... }} values
# become shell-quoted words, so a value cannot break the command. Like every query, the
# result then goes through query.transform and must be rows: the GitHub API returns a list
# of releases with nested assets, so the transform picks the fields and sums the
# downloads. dbdash asks whether you trust this file first, because of the transform
# (:help dbdash-http, :help dbdash-transform).
# Try: :DbDashStart http.yaml repo=folke/lazy.nvim

title: "GitHub API over HTTP"
description: |
  An HTTPS API as a data source: a GET of the GitHub releases of a repository, the JSON
  list of objects shown as rows. Needs network. See `:help dbdash-http`.

database:
  url: "https://api.github.com"

query:
  args:
    - name: repo
      type: string
      default: "neovim/neovim"
    - name: count
      type: int
      default: 10
  autoescape: true # {{ ... }} values are shell-quoted words of the command
  sql: |
    curl /repos/{{ args.repo }}/releases -G \
      -d per_page={{ args.count }} \
      -H 'Accept: application/vnd.github+json'
  transform: |
    local out = {}
    for _, r in ipairs(rs) do
      local downloads = 0
      for _, a in ipairs(r.assets or {}) do
        downloads = downloads + (a.download_count or 0)
      end
      out[#out + 1] = {
        release = r.tag_name,
        published = (r.published_at or ""):sub(1, 10),
        downloads = downloads,
        prerelease = r.prerelease,
      }
    end
    return { columns = { "release", "published", "downloads", "prerelease" }, rows = out }

show:
  args_show: true
  type: table
  title: "GitHub releases"
  description: |
    The latest releases of `{{ args.repo }}` from `{{ meta.db_url }}`: a JSON list of
    objects needs no transform; `column_list` picks and renames the fields. Change the
    repository with `a`.
  interval: 10m # unauthenticated GitHub API calls are limited to 60 an hour
  column_list:
    - column: release
    - column: published
    - column: downloads
      alias: "Downloads"
    - column: prerelease
      alias: "Pre"
