# yaml-language-server: $schema=./dbdash.schema.yaml
#
# A SQLite file database. Relative paths are resolved against this config's directory;
# sqlite:///absolute/path.db works too. database.options:
#   create: true     create the file when it does not exist (off by default, so a typo
#                    does not silently create an empty database)
#   readonly: true   open read-only
#   lib_path: ...    which libsqlite3 to load (normally found automatically)
#
# Each refresh logs a row, so the chart grows over time.

database:
  url: "sqlite:///tmp/dbdash-example.db"
  options:
    create: true

query:
  sql: |
    CREATE TABLE IF NOT EXISTS samples (at TEXT, value INTEGER);
    INSERT INTO samples VALUES (strftime('%H:%M:%S', 'now'), abs(random() % 100));
    SELECT at, value FROM samples ORDER BY rowid DESC LIMIT 30

show:
  type: line
  title: "Logged samples (newest first)"
  interval: 5s
  x_column: at
  y_column: value
  show_countdown: true
  countdown_format: "{time}s"
