# yaml-language-server: $schema=./dbdash.schema.yaml
#
# Several panels in one dashboard (layout.columns per row; show.span to widen a panel).
# Each panel refreshes on its own show.interval; the top-level interval is the default
# and also refreshes every panel.
# The top-level database is the default of every panel; a panel may set its own
# (panels[].database), and a panel without one needs the top-level default. Panels can mix
# data sources: the last one asks the GitHub API over https:// (needs network).
database:
  url: "sqlite:///:memory:"

interval: 10m # also refreshes every panel, so it stays within the GitHub API's limit

args:
  - name: hours
    type: int
    default: 24
    description: "Hours of history"

layout:
  columns: 2
  gap: 3

panels:
  - query:
      sql: |
        WITH RECURSIVE h(n) AS (SELECT 0 UNION ALL SELECT n + 1 FROM h WHERE n < {{ args.hours }} - 1)
        SELECT printf('%02d:00', n % 24) AS hour,
               50 + abs(random() % 100) AS visits
        FROM h
    show:
      type: line
      title: "Visits per hour"
      x_column: hour
      y_column: visits
      interval: 10s
      span: 2
      show_countdown: true
      countdown_format: "{time}s"

  - query:
      sql: |
        SELECT 'IT' AS dept, 42 AS people UNION ALL SELECT 'HR', 7
        UNION ALL SELECT 'Finance', 15 UNION ALL SELECT 'R&D', 120
    show:
      type: pie
      renderer: circle
      title: "Headcount"
      label_column: dept
      value_column: people

  - query:
      sql: |
        SELECT datetime('now') AS now, abs(random() % 1000) AS orders
    show:
      type: table
      title: "Now"
      interval: 60s
      show_countdown: true
      countdown_format: "{time}s"

  - database:                       # this panel's own database (e.g. another server)
      url: "sqlite:///:memory:"
    query:
      sql: |
        SELECT abs(random() % 5000) AS orders
    show:
      type: stat
      title: "Orders today"
      format: "{:,}"
      interval: 10s

  - database:                       # another data source: an HTTPS JSON API
      url: "https://api.github.com"
    query:
      # A GET with parameters (:help dbdash-http). The response is a list of flat records,
      # which are rows as they are: no transform needed.
      sql: |
        {
          "path": "/repos/neovim/neovim/contributors",
          "query": {"per_page": 8},
          "headers": {"Accept": "application/vnd.github+json"}
        }
    show:
      type: bar
      title: "Top Neovim contributors"
      x_column: login
      y_column: contributions
      span: 2                       # refreshes on the top-level 10m: unauthenticated GitHub
                                    # API calls are limited to 60 an hour
      style:
        show_values: true
